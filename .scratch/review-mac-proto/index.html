<!doctype html>
<html lang="zh-CN" data-theme="mac-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代码评审 · mac 风格原型</title>
<!--
  原型（throwaway）：只回答一个问题 —— 右栏「代码评审」页签该长什么样。
  四个方案，底部浮条 / ← → 切换；宽度可切 300 / 420 / 600（右栏真实范围 220–600），主题可切三套。
  数据是假的但密度按真实来（PR 列表、在跑、完成、失败、零意见）。
  不接桥、不落盘、不提交。
-->
<style>
/* ---------------------------------------------------------------- 主题 token（抄自 web/src/theme-tokens.css） */
:root {
  --bg: #f5f5f7; --sunken: #ececef; --panel: #ffffff; --panel-2: #f2f2f4; --panel-3: #e8e8ed;
  --line: #dedee3; --line-soft: #ebebef; --line-strong: #c7c7cc; --line-lit: #aeaeb2;
  --text: #1d1d1f; --dim: #515154; --faint: #636366;
  --accent: #007aff; --accent-bg: color-mix(in srgb, var(--accent) 9%, #fff);
  --accent-dim: #dbeaff; --accent-ink: #ffffff;
  --ok: #248a3d; --ok-bg: #eaf7ee; --warn: #b25000; --warn-bg: #fff6e5;
  --danger: #d70015; --danger-bg: #fff0f1;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
  --mac-ease: cubic-bezier(0.32, 0.72, 0, 1);
  --mac-spring: cubic-bezier(0.34, 1.42, 0.64, 1);
  --mac-blur: saturate(180%) blur(28px);
  --mac-blur-strong: saturate(190%) blur(44px);
  color-scheme: light;
}
:root[data-theme="mac-dark"] {
  --bg: #1c1c1e; --sunken: #161618; --panel: #232325; --panel-2: #2c2c2e; --panel-3: #343436;
  --line: #38383a; --line-soft: #2e2e30; --line-strong: #48484a; --line-lit: #5a5a5e;
  --text: #f5f5f7; --dim: #b8b8bd; --faint: #a1a1a6;
  --accent-bg: color-mix(in srgb, var(--accent) 14%, #1c1c1e); --accent-ink: #04202b;
  --ok: #30d158; --ok-bg: #102a18; --warn: #ffd60a; --warn-bg: #2b2508; --danger: #ff453a; --danger-bg: #331311;
  color-scheme: dark;
}
:root[data-theme="mac-midnight"] {
  --bg: #171c26; --sunken: #131720; --panel: #1d2330; --panel-2: #242b3a; --panel-3: #2b3343;
  --line: #333c4e; --line-soft: #283041; --line-strong: #434d63; --line-lit: #56617a;
  --text: #eef1f7; --dim: #b3bccc; --faint: #a3adbf;
  --accent-bg: color-mix(in srgb, var(--accent) 14%, #171c26); --accent-ink: #04202b;
  --ok: #30d158; --ok-bg: #11291f; --warn: #ffd60a; --warn-bg: #2a2614; --danger: #ff453a; --danger-bg: #33171d;
  color-scheme: dark;
}

/* 材质（抄自 web/src/mac-base.css） */
:root[data-theme="mac-light"] {
  --mac-wall:
    radial-gradient(1100px 760px at 8% -6%, rgba(110, 168, 255, 0.5), transparent 62%),
    radial-gradient(980px 720px at 104% 12%, rgba(255, 150, 196, 0.42), transparent 62%),
    radial-gradient(1000px 760px at 52% 112%, rgba(140, 226, 204, 0.5), transparent 62%),
    linear-gradient(180deg, #eef1f7, #f3eff5);
  --mac-glass: rgba(255, 255, 255, 0.58);
  --mac-glass-strong: rgba(252, 252, 254, 0.8);
  --mac-glass-solid: rgba(255, 255, 255, 0.92);
  --mac-glass-line: rgba(0, 0, 0, 0.09);
  --mac-glass-hi: rgba(255, 255, 255, 0.85);
  --mac-fill: rgba(0, 0, 0, 0.045);
  --mac-fill-2: rgba(0, 0, 0, 0.085);
  --mac-control: linear-gradient(180deg, #ffffff, #f6f6f8);
  --mac-control-line: rgba(0, 0, 0, 0.12);
  --mac-knob: #ffffff;
  --mac-track: rgba(120, 120, 128, 0.24);
  --mac-shadow-panel: 0 0 0 0.5px rgba(0, 0, 0, 0.08), 0 8px 30px rgba(40, 50, 90, 0.1);
  --mac-shadow-menu: 0 0 0 0.5px rgba(0, 0, 0, 0.16), 0 12px 36px rgba(0, 0, 0, 0.18);
  --mac-scrim: rgba(40, 44, 60, 0.18);
}
:root[data-theme="mac-dark"] {
  --mac-wall:
    radial-gradient(1100px 760px at 6% -8%, rgba(94, 92, 230, 0.4), transparent 62%),
    radial-gradient(980px 720px at 106% 8%, rgba(191, 90, 242, 0.26), transparent 62%),
    radial-gradient(1000px 760px at 56% 118%, rgba(10, 132, 255, 0.26), transparent 62%),
    linear-gradient(180deg, #131316, #18171c);
  --mac-glass: rgba(38, 38, 42, 0.56);
  --mac-glass-strong: rgba(36, 36, 40, 0.8);
  --mac-glass-solid: rgba(40, 40, 44, 0.94);
  --mac-glass-line: rgba(255, 255, 255, 0.1);
  --mac-glass-hi: rgba(255, 255, 255, 0.09);
  --mac-fill: rgba(255, 255, 255, 0.06);
  --mac-fill-2: rgba(255, 255, 255, 0.11);
  --mac-control: linear-gradient(180deg, #5b5b60, #4a4a4f);
  --mac-control-line: rgba(0, 0, 0, 0.5);
  --mac-knob: #636366;
  --mac-track: rgba(120, 120, 128, 0.36);
  --mac-shadow-panel: 0 0 0 0.5px rgba(0, 0, 0, 0.6), inset 0 0.5px 0 rgba(255, 255, 255, 0.08), 0 10px 34px rgba(0, 0, 0, 0.35);
  --mac-shadow-menu: 0 0 0 0.5px rgba(0, 0, 0, 0.7), inset 0 0.5px 0 rgba(255, 255, 255, 0.12), 0 14px 40px rgba(0, 0, 0, 0.5);
  --mac-scrim: rgba(0, 0, 0, 0.32);
}
:root[data-theme="mac-midnight"] {
  --mac-wall:
    radial-gradient(1100px 760px at 4% -10%, rgba(40, 110, 230, 0.48), transparent 62%),
    radial-gradient(980px 720px at 106% 10%, rgba(110, 80, 230, 0.32), transparent 62%),
    radial-gradient(1000px 760px at 52% 120%, rgba(0, 170, 210, 0.24), transparent 62%),
    linear-gradient(180deg, #0e1422, #121a2b);
  --mac-glass: rgba(30, 38, 58, 0.55);
  --mac-glass-strong: rgba(28, 35, 54, 0.8);
  --mac-glass-solid: rgba(32, 40, 60, 0.94);
  --mac-glass-line: rgba(170, 195, 255, 0.13);
  --mac-glass-hi: rgba(200, 220, 255, 0.1);
  --mac-fill: rgba(170, 195, 255, 0.07);
  --mac-fill-2: rgba(170, 195, 255, 0.13);
  --mac-control: linear-gradient(180deg, #46506a, #394259);
  --mac-control-line: rgba(0, 0, 0, 0.45);
  --mac-knob: #4b5675;
  --mac-track: rgba(130, 145, 180, 0.34);
  --mac-shadow-panel: 0 0 0 0.5px rgba(0, 0, 0, 0.55), inset 0 0.5px 0 rgba(200, 220, 255, 0.1), 0 10px 34px rgba(0, 6, 20, 0.4);
  --mac-shadow-menu: 0 0 0 0.5px rgba(0, 0, 0, 0.7), inset 0 0.5px 0 rgba(200, 220, 255, 0.14), 0 14px 40px rgba(0, 6, 20, 0.55);
  --mac-scrim: rgba(2, 6, 16, 0.34);
}

/* ---------------------------------------------------------------- 底座 */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--sans); font-size: 14px; letter-spacing: -0.003em; color: var(--text);
  background: var(--mac-wall); background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  display: flex; align-items: stretch; justify-content: center;
  padding: 26px 16px 108px;
}
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 1px;
}
svg { display: block; }
.grow { flex: 1 1 auto; }
.dim { color: var(--faint); }
.mono { font-family: var(--mono); }

/* 右栏外壳：mac 主题里它就是浮在壁纸上的玻璃面板（margin 8/10、圆角 16、mac-shadow-panel）。 */
.pane {
  width: var(--pane-w, 420px); max-width: 100%; min-height: 0;
  display: flex; flex-direction: column;
  background: var(--mac-glass); -webkit-backdrop-filter: var(--mac-blur-strong); backdrop-filter: var(--mac-blur-strong);
  border: 0.5px solid var(--mac-glass-line); border-radius: 16px; box-shadow: var(--mac-shadow-panel);
  overflow: hidden; container-type: inline-size;
  transition: width 320ms var(--mac-spring);
}

/* 页签：现在是一条下划线，改成 macOS 分段控件（灰槽 + 白滑块）。四个页签共用，属于宿主。 */
.ptabs {
  flex: none; display: flex; gap: 2px; margin: 8px 10px 0; padding: 2px;
  background: var(--mac-fill-2); border-radius: 9px;
}
.ptabs button {
  flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 4px;
  padding: 4px 2px; font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap;
  background: transparent; border: 0; border-radius: 7px; cursor: pointer;
  transition: background 300ms var(--mac-ease), box-shadow 300ms var(--mac-ease), scale 240ms var(--mac-spring);
}
.ptabs button:active { scale: 0.97; }
.ptabs button.on { background: var(--mac-knob); box-shadow: 0 0.5px 0 rgba(0,0,0,.04), 0 1px 4px rgba(0,0,0,.16); }
.ptabs .pip {
  flex: none; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px;
  background: var(--warn); color: #fff; font-size: 10px; line-height: 15px; font-weight: 700; text-align: center;
}
.ptabs .dotpip { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.panel {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
  padding: 10px 11px 14px; display: flex; flex-direction: column;
}
.panel::-webkit-scrollbar { width: 11px; }
.panel::-webkit-scrollbar-thumb { background: color-mix(in srgb, rgba(0,0,0,.3) 55%, transparent); border: 3px solid transparent; background-clip: content-box; border-radius: 999px; }

/* ---------------------------------------------------------------- 共用控件 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap;
  padding: 5px 12px; font-size: 12.5px; font-weight: 500; line-height: 1.5;
  border: 0.5px solid var(--mac-control-line); border-radius: 8px;
  background: var(--mac-control); color: var(--text);
  box-shadow: 0 0.5px 1.5px rgba(0,0,0,.12), inset 0 0.5px 0 rgba(255,255,255,.14);
  cursor: pointer; transition: filter 140ms var(--mac-ease), scale 260ms var(--mac-spring);
}
.btn:hover { filter: brightness(1.04); }
.btn:active { scale: 0.96; filter: brightness(0.94); }
.btn svg { flex: none; width: 13px; height: 13px; }
.btn.pri {
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #fff), var(--accent));
  color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 70%, #000);
  box-shadow: 0 1px 3px color-mix(in srgb, var(--accent) 40%, transparent), inset 0 0.5px 0 rgba(255,255,255,.3);
}
.btn.pri:hover { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 80%, #fff), var(--accent)); }
.btn.pri:disabled { background: var(--mac-fill-2); color: var(--faint); border-color: transparent; box-shadow: none; cursor: default; scale: 1; filter: none; }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--dim); }
.btn.ghost:hover { background: var(--mac-fill-2); }
.btn.sm { padding: 2px 8px; font-size: 11.5px; border-radius: 7px; }
.btn.block { width: 100%; }

.iconbtn {
  flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; padding: 0;
  color: var(--dim); background: transparent; border: 0; border-radius: 7px; cursor: pointer;
  transition: background 140ms var(--mac-ease), scale 240ms var(--mac-spring);
}
.iconbtn:hover { background: var(--mac-fill-2); color: var(--text); }
.iconbtn:active { scale: 0.92; }
.iconbtn svg { width: 14px; height: 14px; }

.seg { display: flex; gap: 2px; padding: 2px; background: var(--mac-fill-2); border-radius: 9px; }
.seg button {
  flex: 1 1 0; min-width: 0; padding: 4px 2px; font-size: 11.5px; font-weight: 500; color: var(--text);
  white-space: nowrap; background: transparent; border: 0; border-radius: 7px; cursor: pointer;
  transition: background 300ms var(--mac-ease), box-shadow 300ms var(--mac-ease), scale 240ms var(--mac-spring);
}
.seg button:active { scale: 0.96; }
.seg button.on { background: var(--mac-knob); box-shadow: 0 0.5px 0 rgba(0,0,0,.04), 0 1px 4px rgba(0,0,0,.16); }

.field {
  display: flex; align-items: center; gap: 6px; width: 100%; min-width: 0;
  padding: 5px 9px; font-size: 12px; text-align: left; color: var(--text);
  background: var(--mac-glass-solid); border: 0.5px solid var(--mac-control-line); border-radius: 8px;
}
button.field { cursor: pointer; }
button.field:hover { border-color: var(--line-lit); }
.field .chev { margin-left: auto; color: var(--faint); }
.field.placeholder { color: var(--faint); }

.chip {
  display: inline-flex; align-items: center; gap: 5px; max-width: 100%; min-width: 0;
  white-space: nowrap;
  padding: 4px 9px; font-size: 11.5px; color: var(--text);
  background: var(--mac-control); border: 0.5px solid var(--mac-control-line); border-radius: 8px;
  box-shadow: 0 0.5px 1px rgba(0,0,0,.1); cursor: pointer;
}
.chip:hover { filter: brightness(1.04); }
.chip .m { color: var(--faint); font-weight: 400; }

.hint { margin: 0; font-size: 11.5px; line-height: 1.5; color: var(--faint); }
.credit {
  display: flex; align-items: center; gap: 5px; padding-top: 10px;
  font-size: 10.5px; color: var(--faint);
}
.credit svg { width: 12px; height: 12px; flex: none; opacity: .8; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--faint); white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.done { color: var(--ok); }
.pill.running { color: var(--accent); }
.pill.failed { color: var(--danger); }
.pill.stale { color: var(--warn); }

.bar { display: block; height: 3px; border-radius: 2px; background: var(--mac-track); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 2px; background: var(--accent); transition: width 400ms var(--mac-ease); }

.sev {
  display: inline-flex; align-items: center; gap: 3px; flex: none;
  padding: 0 5px; font-size: 10px; font-weight: 600; line-height: 15px; border-radius: 5px;
}
.sev::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.sev.critical { color: var(--danger); background: color-mix(in srgb, var(--danger) 16%, transparent); }
.sev.high { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
.sev.medium { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.sev.low { color: var(--faint); background: var(--mac-fill-2); }

.sevbar { display: flex; gap: 2px; height: 4px; border-radius: 2px; overflow: hidden; }
.sevbar > i { display: block; height: 100%; }
.sevbar .critical { background: color-mix(in srgb, var(--danger) 90%, #000); }
.sevbar .high { background: var(--danger); }
.sevbar .medium { background: var(--warn); }
.sevbar .low { background: var(--line-lit); }
.sevbar .clean { background: var(--ok); }

.card {
  background: var(--mac-glass-strong); border: 0.5px solid var(--mac-glass-line);
  border-radius: 13px; box-shadow: 0 1px 2px rgba(0,0,0,.05);
}

/* ================================================================ 方案 A：工具条 + 记录列表（Finder 味） */
.va { display: flex; flex-direction: column; gap: 8px; min-height: 0; flex: 1 1 auto; }
.va-head { display: flex; align-items: center; gap: 6px; min-width: 0; }
.va-repo {
  display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%;
  padding: 3px 7px; font-size: 12.5px; font-weight: 600; color: var(--text);
  background: transparent; border: 0; border-radius: 7px; cursor: pointer;
}
.va-repo:hover { background: var(--mac-fill); }
.va-repo svg { flex: none; width: 14px; height: 14px; color: var(--accent); }
.va-repo .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.va-repo .chev { flex: none; color: var(--faint); }
.va-head .iconbtn { margin-left: auto; }

/* 控制区：窄栏三行（分段 / 目标 / 模型+按钮），宽栏把分段 + 模型 + 按钮并成一条工具条。
   用 grid areas 钉死，别靠 flex-wrap 猜 —— 差 6px 就换到另一行的布局在 220–600 之间来回跳。 */
.va-form {
  display: grid; gap: 6px; min-width: 0;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "seg seg" "target target" "model run";
}
.va-form .va-seg { grid-area: seg; }
.va-form .va-target, .va-form .va-empty { grid-area: target; }
.va-form .va-model { grid-area: model; justify-self: stretch; min-width: 0; }
.va-form .va-run { grid-area: run; }
.va-form .seg button { padding-inline: 8px; }
@container (min-width: 468px) {
  .va-form {
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: "seg model run" "target target target";
  }
  .va-form .va-seg { justify-self: start; }
  .va-form .va-model { justify-self: start; max-width: 250px; min-width: 130px; }
}
.va-target { display: flex; gap: 5px; align-items: stretch; min-width: 0; }
.va-pick {
  flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; text-align: left;
  padding: 6px 9px; background: var(--mac-glass-solid); border: 0.5px solid var(--mac-control-line);
  border-radius: 9px; cursor: pointer;
}
.va-pick:hover { border-color: var(--line-lit); }
.va-pick-main { display: flex; gap: 5px; align-items: baseline; min-width: 0; font-size: 12.5px; font-weight: 500; }
.va-pick-main .num { flex: none; color: var(--accent); font-variant-numeric: tabular-nums; }
.va-pick-main .ttl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.va-pick-sub { font-size: 10.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.va-target > .iconbtn { align-self: center; width: 30px; height: 30px; border: 0.5px solid var(--mac-control-line); background: var(--mac-control); }

.va-model { min-width: 0; }
.va-model .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.va-model .m { flex: none; color: var(--faint); white-space: nowrap; }
.va-why { margin: -2px 0 0; }

.va-list { display: flex; flex-direction: column; min-width: 0; margin-top: 2px; }
.va-list-head {
  display: grid; grid-template-columns: 7px minmax(0,1fr) auto auto; gap: 7px; align-items: baseline;
  padding: 0 8px 4px; font-size: 10.5px; font-weight: 500; color: var(--faint);
  border-bottom: 0.5px solid var(--line-soft); margin-bottom: 2px;
}
.va-list-head .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.va-row {
  display: grid; grid-template-columns: 7px minmax(0,1fr) auto auto; gap: 7px; align-items: center;
  width: 100%; padding: 7px 8px; text-align: left; background: transparent; border: 0; border-radius: 8px; cursor: pointer;
}
.va-row:hover { background: var(--mac-fill); }
.va-row:active { scale: 0.995; }
.va-row .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--line-lit); }
.va-row .dot.done { background: var(--ok); }
.va-row .dot.running { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); animation: pulse 1.6s var(--mac-ease) infinite; }
.va-row .dot.failed { background: var(--danger); }
.va-row .dot.stale { background: var(--warn); }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 8%, transparent); } }
.va-row-main { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.va-row-t { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.va-row-t b { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.va-row-s { font-size: 10.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.va-row-s.bad { color: var(--danger); }
.va-row-num { flex: none; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; text-align: right; }
.va-row-num.high, .va-row-num.critical { color: var(--danger); font-weight: 600; }
.va-row-num.medium { color: var(--warn); font-weight: 600; }
.va-row-num.clean { color: var(--ok); }
.va-row-time { flex: none; font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.va-row .bar { grid-column: 2 / -1; width: 100%; margin-top: 3px; }
.va-empty { padding: 10px 8px; display: flex; flex-direction: column; gap: 8px; }
.va-empty-row {
  display: flex; gap: 7px; align-items: baseline; width: 100%; padding: 6px 8px; text-align: left;
  background: var(--mac-fill); border: 0; border-radius: 8px; cursor: pointer;
}
.va-empty-row:hover { background: var(--mac-fill-2); }

    if (!total) return `conic-gradient(var(--mac-track) 0 100%, transparent 0)`;
    let at = 0;
    const stops = rank
      .filter((k) => sev[k])
      .map((k) => {
        const from = at;
        at += (sev[k] / total) * 100;
        return `var(--${k === "critical" ? "danger" : k === "medium" ? "warn" : k === "low" ? "line-lit" : "danger"}) ${from}% ${at}%`;
      });
    return `conic-gradient(${stops.join(", ")})`;
  }

  function vcHero() {
    if (S.empty) {
      return `<div class="card vc-hero">
        <div class="vc-ring" style="background:${sevRing({})}"><span class="n">—</span></div>
        <div class="vc-sum">
          <span class="vc-sum-l">最近一次</span>
          <span class="vc-sum-t">还没有评审记录</span>
          <span class="vc-sum-s">pi-web-client · ocr 1.9.3 已就绪</span>
        </div>
      </div>`;
    }
    const latest = S.finished
      ? { num: "#712", title: "评审页：mac 风格改版", count: 3, files: 12, took: "41 秒", sev: { high: 1, medium: 2 }, when: "刚刚" }
      : { num: "#709", title: "bridge：热部署 worker 代理选择", count: 4, files: 9, took: "34 秒", sev: { high: 2, medium: 2 }, when: "今天 09:58" };
    return `<div class="card vc-hero">
      <div class="vc-ring" style="background:${sevRing(latest.sev)}"><span class="n">${latest.count}</span></div>
      <div class="vc-sum">
        <span class="vc-sum-l">最近一次 · ${esc(latest.when)}</span>
        <span class="vc-sum-t"><span class="num">${latest.num}</span> ${esc(latest.title)}</span>
        <span class="vc-sum-s">${latest.count} 条意见 · ${latest.files} 个文件 · ${latest.took} · ${esc(MODEL.name)}</span>
        <div class="vc-chips">${sevChips(latest.sev)}<button type="button" class="btn sm ghost" data-act="detail" data-id="${S.finished ? "fresh" : "h709"}">看意见 ${ICO.chev}</button></div>
      </div>
    </div>`;
  }

  function vcLive() {
    if (!S.running) return "";
    return `<div class="card vc-live">
      <div class="vc-live-top"><b>#712</b><span>评审页：mac 风格改版</span>
        <button type="button" class="btn sm" data-act="stop">停止</button></div>
      <div class="bar"><i data-live="bar" style="width:${pct()}%"></i></div>
      <div class="vc-live-foot"><span data-live="pct">${reviewedCount()}/12 个文件</span><span class="f" data-live="file">${currentFile()}</span></div>
    </div>`;
  }

  function vcHist() {
    if (S.empty) {
      return `<div class="card vc-empty">${ICO.empty}<span>评完之后，这里按时间列着每一次。</span></div>`;
    }
    const rows = (S.finished ? HIST : HIST.slice(1)).map(
      (r) => `<button type="button" class="vc-row" data-act="detail" data-id="${r.id}">
        <span class="pill ${r.status}">${r.status === "done" ? (r.sev.clean ? "没问题" : `${r.count} 条`) : r.status === "failed" ? "失败" : "在跑"}</span>
        <span class="vc-row-main">
          <span class="vc-row-t">${esc(r.num)}${r.title ? " · " + esc(r.title) : ""}</span>
          <span class="vc-row-s">${r.when}${r.status === "failed" ? " · " + esc(r.err) : ""}</span>
        </span>
        <span class="vc-row-s" style="flex:none">${ICO.chev}</span>
      </button>`,
    ).join("");
    return `<div class="vc-hist"><div class="vc-hist-head">更早的评审</div>${rows}</div>`;
  }

  function vcForm() {
    const open = S.compose || S.empty;
    const body =
      S.mode === "pr"
        ? S.empty
          ? `<div class="card" style="display:flex;flex-direction:column;gap:3px;padding:5px">${prRows("va-empty-row")}</div>
             <button type="button" class="field placeholder" data-act="none"><span>输号或搜</span><span class="chev">${ICO.down}</span></button>`
          : `<button type="button" class="field" data-act="pick-pr" data-pr="${pr().n}"><span style="color:var(--accent)">#${pr().n}</span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(pr().title)}</span><span class="chev">${ICO.down}</span></button>`
        : S.mode === "range"
          ? `<div class="row"><button type="button" class="field" data-act="none"><span class="mono">HEAD</span><span class="chev">${ICO.down}</span></button><button type="button" class="field" data-act="none"><span class="mono">main</span><span class="chev">${ICO.down}</span></button></div>`
          : S.mode === "commit"
            ? `<div class="row"><button type="button" class="field mono" data-act="none">3fa9c21 · 修右栏宽度</button></div>`
            : `<p class="hint">评 HEAD 之前未提交的改动。</p>`;
    return `<div class="vc-form card" ${open ? "" : "hidden"}>
      ${modeSeg()}
      ${body}
      <div class="row">${modelChip("va-model")}${accountChip()}</div>
      <div class="row"><button type="button" class="btn pri block" data-act="run" ${S.empty || S.running ? "disabled" : ""}>${S.running ? "评审中…" : "开始评审"}</button></div>
    </div>`;
  }

  function renderC() {
    const open = S.compose || S.empty;
    return `<div class="vc">
      ${vcHero()}
      ${vcLive()}
      ${vcHist()}
      <div class="vc-compose ${open ? "" : "pinned"}">
        ${vcForm()}
        ${open ? "" : `<button type="button" class="vc-new" data-act="compose">
          <span class="plus">${ICO.plus}</span><span>新评审</span>
          <span class="cfg">PR #712 · 跟随工作区</span>${ICO.down}
        </button>`}
      </div>
    </div>`;
  }

  /* ---------------------------------------------------------------- 方案 D */
  const TILES = [
    ["workspace", "工作区改动", "HEAD 之前"],
    ["range", "分支对比", "HEAD ← main"],
    ["commit", "单个提交", "3fa9c21"],
    ["pr", "GitHub PR", "#712"],
  ];

  function vdTiles() {
    return `<div class="vd-tiles">${TILES.map(([k, t, s]) => {
      const icon = k === "range" ? ICO.branch : k === "commit" ? ICO.commit : k === "workspace" ? ICO.workspace : ICO.pr;
      const on = S.mode === k;
      return `<button type="button" class="vd-tile ${on ? "on" : ""}" data-act="mode" data-mode="${k}">
        <span class="ic">${icon}</span><span class="t">${t}</span><span class="s">${on && k === "pr" ? (S.empty ? "没选" : "#712 · pi-web-client") : s}</span>
      </button>`;
    }).join("")}</div>`;
  }

  function vdTarget() {
    if (S.mode !== "pr") {
      if (S.mode === "range")
        return `<div class="vd-opts"><button type="button" class="chip" data-act="none"><span class="mono">HEAD</span>${ICO.down}</button><button type="button" class="chip" data-act="none"><span class="mono">main</span>${ICO.down}</button></div>`;
      if (S.mode === "commit") return `<button type="button" class="field mono" data-act="none">3fa9c21 · 修右栏宽度</button>`;
      return `<p class="hint">评 HEAD 之前未提交的改动。</p>`;
    }
    if (S.empty) return `<div class="card" style="display:flex;flex-direction:column;gap:3px;padding:5px">${prRows("va-empty-row")}</div>`;
    return `<button type="button" class="field" data-act="pick-pr" data-pr="${pr().n}">
      <span style="color:var(--accent)">#${pr().n}</span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(pr().title)}</span><span class="chev">${ICO.down}</span></button>`;
  }

  function vdTimeline() {
    if (S.empty) return `<div class="vd-empty">还没有评审。选好范围、点开始，记录会按时间排在这里。</div>`;
    const items = [];
    if (S.running) {
      items.push(`<button type="button" class="vd-item running" data-act="detail" data-id="run">
        <span class="vd-item-top"><b>#712</b><span class="when">刚刚</span></span>
        <span class="vd-item-ttl">评审页：mac 风格改版</span>
        <span class="vd-item-meta"><span class="m" data-live="pct">正在评 ${reviewedCount()}/12 个文件</span></span>
        <span class="bar"><i data-live="bar" style="width:${pct()}%"></i></span>
      </button>`);
    } else if (S.finished) {
      items.push(`<button type="button" class="vd-item done" data-act="detail" data-id="fresh">
        <span class="vd-item-top"><b>#712</b><span class="when">刚刚</span></span>
        <span class="vd-item-ttl">评审页：mac 风格改版 · 完成，3 条意见</span>
        <span class="vd-item-meta">${sevChips(runSev())}<span class="m">12 个文件 · 41 秒</span></span>
      </button>`);
    }
    for (const r of HIST) {
      items.push(`<button type="button" class="vd-item ${r.status}" data-act="detail" data-id="${r.id}">
        <span class="vd-item-top"><b>${esc(r.num)}</b><span class="when">${esc(r.when)}</span></span>
        <span class="vd-item-ttl">${esc(r.title)}${r.status === "done" && !r.sev.clean ? ` · ${r.count} 条意见` : r.sev.clean ? " · 评过，没有问题" : ""}</span>
        <span class="vd-item-meta">${r.status === "failed" ? `<span class="m" style="color:var(--danger)">${esc(r.err)}</span>` : `${sevChips(r.sev)}<span class="m">${r.files} 个文件 · ${r.took}</span>`}</span>
      </button>`);
    }
    return `<div class="vd-tl">${items.join("")}</div>`;
  }

  function renderD() {
    return `<div class="vd">
      <div class="vd-lead">评什么</div>
      ${vdTiles()}
      ${vdTarget()}
      <div class="vd-opts">${modelChip("va-model")}${accountChip()}</div>
      <button type="button" class="btn pri vd-run" data-act="run" ${S.empty || S.running ? "disabled" : ""}>${S.running ? "评审中…" : "开始评审"}</button>
      <div class="vd-lead" style="margin-top:2px">记录</div>
      ${vdTimeline()}
      <div class="credit">${ICO.info}<span>ocr 1.9.3 · 阿里巴巴开源</span></div>
    </div>`;
  }

  /* ---------------------------------------------------------------- 详情浮层 */
  function sheetFor(id) {
    if (id === "run") {
      return { target: "#712", title: "评审页：mac 风格改版", status: "running", body: tlHTML(), sev: null };
    }
    if (id === "fresh") {
      return { target: "#712", title: "评审页：mac 风格改版", status: "done", findings: FINDINGS.run, sev: runSev(), meta: "完成 · 3 条意见 · 12 个文件 · 41 秒 · 刚刚" };
    }
    const r = HIST.find((x) => x.id === id) || HIST[0];
    if (r.status === "failed") return { target: r.num, title: r.title, status: "failed", err: r.err, model: r.model };
    const f = FINDINGS[r.id] || FINDINGS[709];
    return { target: r.num, title: r.title, status: "done", findings: f, sev: r.sev, meta: `完成 · ${r.count} 条意见 · ${r.files} 个文件 · ${r.took} · ${r.when} · ${r.model}` };
  }

  function tlHTML() {
    const rows = [
      ["0:02", "读 diff：12 个文件、+318 −96"],
      ["0:05", "分成 3 组（按目录），模型 16k 上下文"],
      ["0:12", "第 1 组完成：web/src（2 条）"],
      ["0:31", "第 2 组完成：bridge（0 条）"],
      ["0:38", "第 3 组：i18n（1 条）"],
      ["0:41", "收尾：合并 3 条意见，按严重度排序"],
    ];
    return `<div class="tl">${rows.map(([at, txt]) => `<div class="tl-row"><span class="tl-at">${at}</span><span class="tl-dot"></span><span class="tl-txt">${esc(txt)}</span></div>`).join("")}</div>`;
  }

  function fndHTML(list) {
    const byPath = new Map();
    for (const f of list) {
      if (!byPath.has(f.path)) byPath.set(f.path, []);
      byPath.get(f.path).push(f);
    }
    return [...byPath.entries()]
      .map(
        ([path, items]) => `<div class="fgrp">
        <div class="fgrp-h"><code>${esc(path)}</code><span>${items.length} 条</span></div>
        ${items
          .map(
            (f) => `<div class="fnd">
            <div class="fnd-h"><span class="sev ${f.sev}">${SEV[f.sev]}</span><span class="fnd-cat">${esc(f.cat)}</span><span class="fnd-line">${esc(path.split("/").pop())}:${f.line}</span></div>
            <p class="fnd-t">${esc(f.text)}</p>
            <div class="fnd-a"><button type="button" class="btn sm" data-act="none">${ICO.sparkle} 交给 AI 修</button><button type="button" class="btn sm ghost" data-act="none">看代码</button></div>
          </div>`,
          )
          .join("")}
      </div>`,
      )
      .join("");
  }

  function renderSheet() {
    const el = document.getElementById("sheet");
    if (!S.detail) { el.innerHTML = ""; return; }
    const d = sheetFor(S.detail);
    const statusText = d.status === "running" ? "运行中" : d.status === "failed" ? "失败" : "完成";
    const metaBits = d.meta ? d.meta.split(" · ").filter((m) => ![ "完成", "失败", "运行中" ].includes(m)) : d.status === "failed" ? [d.model] : [];
    el.innerHTML = `<div class="scrim" data-act="close">
      <div class="sheet" role="dialog" aria-modal="true" aria-label="评审详情" data-stop="1">
        <div class="sheet-head">
          <div class="sheet-titles"><span class="sheet-target">${esc(d.target)}</span><span class="sheet-title">${esc(d.title)}</span></div>
          <button type="button" class="iconbtn" data-act="close" aria-label="关闭">${ICO.x}</button>
        </div>
        <div class="sheet-meta"><span class="pill ${d.status}">${statusText}</span>${metaBits.map((m) => `<span>${esc(m)}</span>`).join('<span class="sep">·</span>')}</div>
        ${d.sev ? `<div class="sheet-sev"><span class="sheet-sev-lab">意见分布</span>${sevBar(d.sev)}<span class="sheet-sev-num">${Object.values(d.sev).reduce((a, b) => a + b, 0)} 条</span></div>` : ""}
        <div class="sheet-body">
          ${d.findings ? fndHTML(d.findings) : d.err ? `<p class="sheet-err">${esc(d.err)}</p><p class="hint">重跑一次就行；这次的中间结果还留在记录里。</p>` : `<div class="fgrp"><div class="fgrp-h"><code>时间线</code><span>${d.target}</span></div>${d.body}</div>`}
        </div>
        <div class="sheet-foot">
          <button type="button" class="btn ghost" data-act="none">${ICO.sparkle} 全部交给 AI</button>
          <span class="grow"></span>
          <button type="button" class="btn pri" data-act="close">完成</button>
        </div>
      </div>
    </div>`;
  }

  /* ---------------------------------------------------------------- 渲染 / 交互 */
  const panelEl = document.getElementById("panel");
  const paneEl = document.getElementById("pane");

  function renderPanel() {
    panelEl.innerHTML = S.v === "A" ? renderA() : S.v === "B" ? renderB() : S.v === "C" ? renderC() : renderD();
  }

  function syncChrome() {
    const meta = META[S.v];    document.getElementById("dname").textContent = meta.name;
    document.getElementById("dwhy").textContent = meta.why;
    document.documentElement.dataset.theme = S.theme;
    paneEl.style.setProperty("--pane-w", S.width + "px");
    document.querySelectorAll(".devbar [data-act='width']").forEach((b) => b.classList.toggle("on", Number(b.dataset.w) === S.width));
    document.querySelectorAll(".devbar [data-act='theme']").forEach((b) => b.classList.toggle("on", b.dataset.t === S.theme));
    document.querySelectorAll(".devbar [data-act='empty']").forEach((b) => b.classList.toggle("on", b.dataset.e === (S.empty ? "1" : "0")));
    // 方案 / 宽度 / 主题进 URL：刷新与转发都停在同一个画面上。首次加载时不回写，否则会把
    // 地址里的 `?v=C` 自己覆盖成 A（然后再去读参数就只能读到 A）。
    if (!S.inited) return;
    try {
      const url = new URL(location.href);
      url.searchParams.set("v", S.v);
      url.searchParams.set("w", String(S.width));
      url.searchParams.set("theme", S.theme);
      url.searchParams.set("empty", S.empty ? "1" : "0");
      history.replaceState(null, "", url);
    } catch {
      /* 某些环境不允许改 URL */
    }
  }

  function render() {
    renderPanel();
    renderSheet();
    syncChrome();
  }

  function renderAll() {
    const top = panelEl.scrollTop;
    render();
    panelEl.scrollTop = top;
  }

  function liveUpdate() {
    document.querySelectorAll('[data-live="bar"]').forEach((n) => { n.style.width = pct() + "%"; });
    document.querySelectorAll('[data-live="pct"]').forEach((n) => {
      n.textContent = n.closest(".vc-live-foot") ? `${reviewedCount()}/12 个文件` : `正在评 ${reviewedCount()}/12 个文件`;
    });
    document.querySelectorAll('[data-live="file"]').forEach((n) => { n.textContent = currentFile(); });
  }

  function startRun() {
    if (S.empty || S.running) return;
    S.running = true; S.progress = 0.06; S.finished = false; S.compose = false;
    renderAll();
    clearInterval(S.timer);
    S.timer = setInterval(() => {
      S.progress = Math.min(1, S.progress + 0.055 + Math.random() * 0.03);
      if (S.progress >= 1) {
        clearInterval(S.timer); S.timer = null;
        S.running = false; S.finished = true;
        renderAll();
        return;
      }
      liveUpdate();
    }, 420);
  }

  function stopRun() {
    clearInterval(S.timer); S.timer = null;
    S.running = false;
    renderAll();
  }

  const next = (dir) => {
    const i = ORDER.indexOf(S.v);
    S.v = ORDER[(i + dir + ORDER.length) % ORDER.length];
    S.detail = null;
    renderAll();
  };

  document.addEventListener("click", (ev) => {
    const scrim = ev.target.closest(".scrim");
    const inSheet = ev.target.closest(".sheet");
    if (scrim && !inSheet) { S.detail = null; renderSheet(); return; }

    const target = ev.target.closest("[data-act]");
    if (!target) return;
    const act = target.dataset.act;
    if (act === "close") { S.detail = null; renderSheet(); return; }
    if (act === "prev") return next(-1);
    if (act === "next") return next(1);
    if (act === "width") { S.width = Number(target.dataset.w); return syncChrome(); }
    if (act === "theme") { S.theme = target.dataset.t; return syncChrome(); }
    if (act === "empty") {
      S.empty = target.dataset.e === "1";
      S.finished = false;
      if (S.empty) { S.running = false; clearInterval(S.timer); S.timer = null; }
      return renderAll();
    }
    if (act === "mode") { S.mode = target.dataset.mode; S.detail = null; return renderAll(); }
    if (act === "pick-pr") {
      S.empty = false; S.pr = Number(target.dataset.pr); S.mode = "pr"; return renderAll();
    }
    if (act === "run") return startRun();
    if (act === "stop") { ev.stopPropagation(); return stopRun(); }
    if (act === "compose") { S.compose = !S.compose; return renderAll(); }
    if (act === "detail") { S.detail = target.dataset.id; return renderSheet(); }
    if (act === "refresh" || act === "model" || act === "account" || act === "none") return;
  });

  document.addEventListener("keydown", (ev) => {
    const tag = (ev.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || ev.target.isContentEditable) return;
    if (ev.key === "Escape" && S.detail) { S.detail = null; renderSheet(); return; }
    if (ev.key === "ArrowLeft") { ev.preventDefault(); next(-1); }
    if (ev.key === "ArrowRight") { ev.preventDefault(); next(1); }
  });

  // 从 URL 里恢复观感（`?v=B&w=300&theme=mac-dark&empty=1`），方便直接指着某一屏讨论。
  try {
    const q = new URLSearchParams(location.search);
    if (ORDER.includes(q.get("v"))) S.v = q.get("v");
    if ([300, 420, 600].includes(Number(q.get("w")))) S.width = Number(q.get("w"));
    if (["mac-light", "mac-dark", "mac-midnight"].includes(q.get("theme"))) S.theme = q.get("theme");
    S.empty = q.get("empty") === "1";
  } catch {
    /* 没有 URL 参数就用默认 */
  }
  render();
  S.inited = true;
})();
</script>
</body>
</html>
