<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 · 提醒角标（UI 样张，一次性）</title>
<!--
  一次性原型，别合进 main。回答的问题：★ 行右端那个「有人在等你」的指示器，还能长成什么样？
  上一片样张（proto/reminders-ui/）定的是清单与位置；这一片只挑那颗东西本身 ——
  用户原话：「铃铛太丑了」。所以这里只换角标，清单与吐司都不出现。

  ?variant=A..E 切，底部浮条 ‹ › 也行。
-->
<style>
  :root {
    --bg: #f5f5f7; --sunken: #ececef; --panel: #ffffff; --panel-2: #f2f2f4; --panel-3: #e8e8ed;
    --line: #dedee3; --line-soft: #ebebef; --line-strong: #c7c7cc; --line-lit: #aeaeb2;
    --text: #1d1d1f; --dim: #515154; --faint: #636366;
    --accent: #007aff; --accent-bg: color-mix(in srgb, var(--accent) 9%, #fff); --accent-dim: #dbeaff; --accent-ink: #fff;
    --ok: #248a3d; --ok-bg: #eaf7ee; --ok-dim: #bfe6c9;
    --warn: #b25000; --warn-bg: #fff6e5; --warn-dim: #f5d9a6;
    --danger: #d70015; --danger-bg: #fff0f1; --danger-dim: #f7c6cb;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
    --r: 12px;
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    --dur-1: 140ms; --dur-2: 180ms;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1e; --sunken: #161618; --panel: #232325; --panel-2: #2c2c2e; --panel-3: #343436;
    --line: #38383a; --line-soft: #2e2e30; --line-strong: #48484a; --line-lit: #5a5a5e;
    --text: #f5f5f7; --dim: #b8b8bd; --faint: #a1a1a6;
    --accent-bg: color-mix(in srgb, var(--accent) 14%, #1c1c1e); --accent-dim: #17364f; --accent-ink: #04202b;
    --ok: #30d158; --ok-bg: #102a18; --ok-dim: #1f4a2c;
    --warn: #ffd60a; --warn-bg: #2b2508; --warn-dim: #4a400f;
    --danger: #ff453a; --danger-bg: #331311; --danger-dim: #55221e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 var(--sans); }
  button { font: inherit; color: inherit; }

  /* ── 假的外壳：只保留「★ 行」这一段，角标就活在它右端 ─────────────────────── */
  .app { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); height: 100dvh; }
  .topbar { display: flex; align-items: center; gap: 8px; padding: 11px 16px; border-bottom: 1px solid var(--line-soft); }
  .topbar .title { font-weight: 500; font-size: 15px; }
  .topbar .spacer { flex: 1; }
  .tbtn { border: 1px solid transparent; background: transparent; color: var(--dim); padding: 5px 9px; border-radius: 8px; font-size: 12px; cursor: pointer; }
  .tbtn:hover { background: var(--panel-2); border-color: var(--line); }
  .ws-tabs { display: flex; gap: 6px; padding: 6px 16px; border-bottom: 1px solid var(--line-soft); }
  .ws-tab { border: 1px solid var(--line); background: var(--panel); color: var(--dim); border-radius: 999px; padding: 3px 11px; font-size: 12px; }
  .ws-tab.on { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-bg); }

  /* ★ 行：左边是胶囊，右边是「角标 + ＋」 */
  .sess-row { position: relative; display: flex; align-items: center; gap: 6px; padding: 6px 16px; border-bottom: 1px solid var(--line-soft); }
  .pin-strip { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; overflow: hidden; }
  .pin-chip { flex: none; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line-soft); background: var(--panel); color: var(--dim); border-radius: 999px; padding: 2px 10px; font-size: 12px; white-space: nowrap; }
  .pin-chip.on { border-color: var(--accent-dim); background: var(--accent-bg); color: var(--accent); }
  .plus { border: 1px solid var(--line); background: var(--panel); color: var(--faint); width: 24px; height: 24px; border-radius: 999px; cursor: pointer; padding: 0; line-height: 1; }

  /* ── 五个角标（同一段 markup 之外的差异全在 body[data-variant] 里） ─────────── */
  .bell { flex: none; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; border-radius: 8px; }
  .bell svg { width: 15px; height: 15px; display: block; }

  /* A：文字胶囊（跟 pin-chip / ws-tab 同一种语言，没有图标） */
  body[data-variant="A"] .bell { border: 1px solid var(--warn-dim); background: var(--warn-bg); color: var(--warn); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  body[data-variant="A"] .bell:hover { border-color: var(--warn); }

  /* B：线描铃铛（currentColor，无底色），数字只是一枚空心圈 */
  body[data-variant="B"] .bell { border: 1px solid transparent; background: transparent; color: var(--dim); padding: 3px 6px; }
  body[data-variant="B"] .bell:hover { background: var(--panel-2); border-color: var(--line); }
  body[data-variant="B"] .bell.has { color: var(--text); }

  /* C：方章数字（没有图标，1px 细边，方块而非圆） */
  body[data-variant="C"] .bell { border: 1px solid var(--line-strong); background: var(--panel); color: var(--text); border-radius: 7px; padding: 3px 7px; font-variant-numeric: tabular-nums; }
  body[data-variant="C"] .bell:hover { border-color: var(--accent); color: var(--accent); }

  /* D：不新增控件 —— 数字挂在当前那颗胶囊的尾巴上 */
  body[data-variant="D"] .bell { display: none; }
  body[data-variant="D"] .pin-chip.on { padding-right: 4px; }
  .chip-tail { display: none; }
  body[data-variant="D"] .pin-chip.on .chip-tail {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 15px; height: 15px; padding: 0 3px; margin-left: 2px;
    border-radius: 999px; background: var(--warn); color: #fff;
    font-size: 10px; font-weight: 600; font-variant-numeric: tabular-nums;
  }

  /* E：最弱的一种 —— 一个点 + 小字，甚至不算按钮 */
  body[data-variant="E"] .bell { border: 0; background: transparent; color: var(--faint); padding: 3px 4px; font-size: 12px; }
  body[data-variant="E"] .bell:hover { color: var(--text); }
  body[data-variant="E"] .bell-dot { width: 6px; height: 6px; border-radius: 999px; background: var(--warn); flex: none; }

  .count-empty { display: none; }

  /* 其余场景的说明块 */
  .stage { overflow: auto; padding: 26px 26px 90px; display: flex; flex-direction: column; gap: 18px; }
  .note { color: var(--dim); max-width: 720px; font-size: 13px; line-height: 1.7; }
  .note b { color: var(--text); }
  .mock { border: 1px solid var(--line-soft); border-radius: 10px; background: var(--panel); padding: 12px 14px; font-family: var(--mono); font-size: 11.5px; color: var(--dim); white-space: pre-wrap; max-width: 760px; }
  .counts { display: flex; gap: 10px; flex-wrap: wrap; }
  .counts .box { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px; }

  /* 浮条 */
  .proto-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; z-index: 90; display: flex; align-items: center; gap: 6px; padding: 7px 9px; border-radius: 999px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line-strong); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18); backdrop-filter: blur(10px); font-size: 12px; }
  .proto-bar .lab { color: var(--faint); font-size: 11px; padding: 0 4px; white-space: nowrap; }
  .proto-bar .v { border: 1px solid var(--line); background: var(--panel); color: var(--dim); width: 26px; height: 26px; border-radius: 999px; cursor: pointer; font-size: 13px; padding: 0; line-height: 1; }
  .proto-bar .v:hover { border-color: var(--accent); color: var(--accent); }
  .proto-bar .cur { font-size: 12px; min-width: 190px; text-align: center; white-space: nowrap; }
  .proto-bar .t { border: 1px solid var(--line); background: var(--panel); color: var(--dim); border-radius: 999px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  .proto-bar .t.on { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  @media (max-width: 760px) { .proto-bar { flex-wrap: wrap; justify-content: center; max-width: calc(100% - 24px); row-gap: 6px; } }
</style>
</head>
<body data-variant="A">
<div class="app">
  <header class="topbar">
    <button class="tbtn">◧</button>
    <span class="title">api 重构</span>
    <span class="spacer"></span>
    <button class="tbtn">📁 文件</button>
    <button class="tbtn">>_ 终端</button>
    <button class="tbtn">🌐 内网通</button>
    <button class="tbtn">⚙ 外观</button>
  </header>

  <nav class="ws-tabs">
    <span class="ws-tab on">pi-web-client</span><span class="ws-tab">api</span><span class="ws-tab">go-svc</span><span class="ws-tab">＋5</span>
  </nav>

  <div class="sess-row">
    <div class="pin-strip">
      <span class="pin-chip on">api 重构<span class="chip-tail" id="chipTail">2</span></span>
      <span class="pin-chip">go-svc 迁移</span>
      <span class="pin-chip">日志排查</span>
      <span class="pin-chip">README 中英对照</span>
    </div>

    <!-- 同一段 markup，五个变体只是外面那层 CSS 不同 -->
    <button class="bell has" id="bell" title="等你的事 · 2 件">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M8 2.2c-2 0-3.2 1.5-3.2 3.4 0 2.4-.7 3.3-1.3 3.9h9c-.6-.6-1.3-1.5-1.3-3.9 0-1.9-1.2-3.4-3.2-3.4Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M6.6 11.6a1.5 1.5 0 0 0 2.8 0" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <span class="bell-dot" aria-hidden="true"></span>
      <span id="count">等你 2</span>
    </button>
    <button class="plus" title="置顶">＋</button>
  </div>

  <main class="stage">
    <div class="note" id="bet"></div>
    <div class="counts">
      <div class="box"><b id="c1">2</b> 件在等（全部会话）<br><span style="color:var(--faint)">角标该显示的数字</span></div>
      <div class="box">角标挨着谁：<b id="c2">★ 行最右端</b></div>
    </div>
    <div class="note">
      这一片只挑<b>那颗东西本身</b>。清单、吐司、跳转都不在这里 —— 它们在
      <code style="font-family:var(--mono)">proto/reminders-ui/</code> 已经定了。
      五个变体都用同一段 markup，差别全在「有没有图标 / 要不要底色 / 挂在哪儿」。
    </div>
  </main>
</div>

<div class="proto-bar">
  <span class="lab">原型 · 一次性</span>
  <button class="v" id="prevV" title="上一个（←）">‹</button>
  <span class="cur" id="curV">A · 文字胶囊</span>
  <button class="v" id="nextV" title="下一个（→）">›</button>
  <span class="lab">|</span>
  <button class="t" id="btnCount">换成 0 件</button>
  <button class="t" id="btnDark">深色</button>
</div>

<script type="module">
const NAMES = { A: "文字胶囊", B: "线描铃铛", C: "方章数字", D: "挂在胶囊上", E: "一个点 + 小字" };
const BETS = {
  A: "<b>A · 文字胶囊</b>：跟 ★ 行的 pin-chip、标签行的 ws-tab 同一种语言 —— 圆角、细边、12px 文字，<b>没有图标</b>。赌的是「这一排已经是文字了，多一个 emoji 就是异类」。代价：占宽（「等你 2」≈ 52px），而且和 pin-chip 长得差不多，容易被当成可点的会话。",
  B: "<b>B · 线描铃铛</b>：把 emoji 换成与顶栏同stroke 的 SVG，颜色只到 <code>--dim</code>；有件事在等时才升到 <code>--text</code>。赌「换个图标就够」，继续用铃铛这个全世界都认识的隐喻。代价：仍然是一枚图标，与这一排的文字不齐。",
  C: "<b>C · 方章数字</b>：不做图标，就一个 <b>1px 细边的方块，里面是数字</b>。赌「你要的是数字，不是铃铛」—— 它像计数器，不像提醒。代价：第一眼没人知道那是什么，得靠 hover title 或首次出现的说明。",
  D: "<b>D · 挂在当前会话胶囊上</b>：不新增任何控件，2 件在等就画在 <code>api 重构</code> 那颗胶囊的尾巴上。赌「你在等的是会话，不是『通知』」。代价：★ 行空着（没有本区会话）时无处可挂，得退回别的位置；而且那个数字看起来像这个小会话自己的未读数。",
  E: "<b>E · 一个点 + 小字</b>：最弱的一档 —— 6px 的点 + 「2 件在等」的小字，颜色只到 <code>--faint</code>。赌「这条指示器不该抢任何注意力」。代价：太安静，盯着中间看的时候根本注意不到 —— 而这正是当初要做它的理由。",
};

const VARIANT_KEYS = Object.keys(NAMES);
const state = { variant: "A", count: 2, dark: false };
const $ = (s) => document.querySelector(s);

function paint() {
  document.body.dataset.variant = state.variant;
  $("#curV").textContent = `${state.variant} · ${NAMES[state.variant]}`;
  $("#bet").innerHTML = BETS[state.variant];
  const n = state.count;
  const label = state.variant === "A" ? `等你 ${n}` : state.variant === "E" ? `${n} 件在等` : String(n);
  $("#count").textContent = n ? label : "";
  $("#c1").textContent = String(state.count);

  /* 数字为 0 时：A / C 直接不出现（没有事情在等就不该占位置），B / E 退成灰的图标，D 的尾巴消失 */
  const bell = $("#bell");
  bell.classList.toggle("has", state.count > 0);
  bell.hidden = state.count === 0 && (state.variant === "A" || state.variant === "C");
  const svg = bell.querySelector("svg");
  svg.hidden = state.variant === "A" || state.variant === "C" || state.variant === "D";
  bell.querySelector(".bell-dot").hidden = state.variant !== "E";
  $("#chipTail").textContent = String(state.count);
  $("#chipTail").style.display = state.count ? "" : "none";
}

function setVariant(v) {
  if (!VARIANT_KEYS.includes(v)) v = "A";
  state.variant = v;
  paint();
  const url = new URL(location.href);
  url.searchParams.set("variant", v);
  history.replaceState(null, "", url);
}

$("#prevV").onclick = () => setVariant(VARIANT_KEYS[(VARIANT_KEYS.indexOf(state.variant) - 1 + 5) % 5]);
$("#nextV").onclick = () => setVariant(VARIANT_KEYS[(VARIANT_KEYS.indexOf(state.variant) + 1) % 5]);
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") $("#prevV").click();
  if (e.key === "ArrowRight") $("#nextV").click();
});
$("#btnCount").onclick = (e) => {
  state.count = state.count ? 0 : 2;
  e.currentTarget.classList.toggle("on", state.count === 0);
  e.currentTarget.textContent = state.count ? "换成 0 件" : "换回 2 件";
  paint();
};
$("#btnDark").onclick = (e) => {
  state.dark = !state.dark;
  e.currentTarget.classList.toggle("on", state.dark);
  document.documentElement.dataset.theme = state.dark ? "dark" : "";
  document.documentElement.style.colorScheme = state.dark ? "dark" : "light";
};

setVariant(new URL(location.href).searchParams.get("variant") || "A");
</script>
</body>
</html>
