<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 · 提醒中心（UI 样张，一次性）</title>
<!--
  一次性原型，别合进 main。回答的问题：「提醒 = 顶栏角标 + 清单 + 吐司」到底长什么样。
  双开这个文件就能跑（没有构建、没有后端、数据全是死数据）。
  变体用 ?variant=A|B|C|D|E 切，底部浮条也能切。

  形态已经定了（docs/DECISIONS.md 的 D389）：右上角弹一条 + 顶栏常驻角标 + 点开一栏清单。
  这个原型只赌「清单长什么样、角标摆哪儿、窄屏怎么活」，以及 A/E 的密度差。
-->
<style>
  /* 主题 token 抄自 web/src/theme-tokens.css（Mac 浅色 / Mac 深色），只抄了用得到的那几档。 */
  :root {
    --bg: #f5f5f7; --sunken: #ececef; --panel: #ffffff; --panel-2: #f2f2f4; --panel-3: #e8e8ed;
    --line: #dedee3; --line-soft: #ebebef; --line-strong: #c7c7cc; --line-lit: #aeaeb2;
    --text: #1d1d1f; --dim: #515154; --faint: #636366;
    --accent: #007aff; --accent-bg: color-mix(in srgb, var(--accent) 9%, #fff); --accent-dim: #dbeaff; --accent-ink: #fff;
    --ok: #248a3d; --ok-bg: #eaf7ee; --ok-dim: #bfe6c9;
    --warn: #b25000; --warn-bg: #fff6e5; --warn-dim: #f5d9a6;
    --danger: #d70015; --danger-bg: #fff0f1; --danger-dim: #f7c6cb;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --r: 12px;
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    --dur-1: 140ms; --dur-2: 180ms;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1e; --sunken: #161618; --panel: #232325; --panel-2: #2c2c2e; --panel-3: #343436;
    --line: #38383a; --line-soft: #2e2e30; --line-strong: #48484a; --line-lit: #5a5a5e;
    --text: #f5f5f7; --dim: #b8b8bd; --faint: #a1a1a6;
    --accent-bg: color-mix(in srgb, var(--accent) 14%, #1c1c1e); --accent-dim: #17364f; --accent-ink: #04202b;
    --ok: #30d158; --ok-bg: #102a18; --ok-dim: #1f4a2c;
    --warn: #ffd60a; --warn-bg: #2b2508; --warn-dim: #4a400f;
    --danger: #ff453a; --danger-bg: #331311; --danger-dim: #55221e;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 var(--sans); overflow: hidden;
  }
  button { font: inherit; color: inherit; }

  /* ── 假的应用外壳（只为让角标出现在它该在的位置上） ───────────────────────── */
  /* 五行对应五个子元素：顶栏 / 标签行 / ★ 行 / 主体 / 输入框。多一个子元素就多一行，主体会掉进 auto 行 */
  .app { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr) auto; height: 100dvh; }
  .topbar {
    display: flex; align-items: center; gap: 8px; padding: 11px 16px;
    border-bottom: 1px solid var(--line-soft); background: var(--bg); position: relative; z-index: 20;
  }
  .topbar .title { font-weight: 500; font-size: 15px; }
  .topbar .spacer { flex: 1; }
  .tbtn {
    border: 1px solid transparent; background: transparent; color: var(--dim);
    padding: 5px 9px; border-radius: 8px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .tbtn:hover { background: var(--panel-2); border-color: var(--line); }
  .tbtn.on { background: var(--accent-bg); border-color: var(--accent-dim); color: var(--accent); }
  .icobtn { width: 30px; text-align: center; padding: 5px 0; }
  .ws-tabs { display: flex; gap: 6px; padding: 6px 16px; border-bottom: 1px solid var(--line-soft); }
  .ws-tab {
    border: 1px solid var(--line); background: var(--panel); color: var(--dim);
    border-radius: 999px; padding: 3px 11px; font-size: 12px; cursor: default;
  }
  .ws-tab.on { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-bg); }
  .main { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 0; }
  .side { border-right: 1px solid var(--line-soft); overflow: auto; padding: 8px; }
  .sess {
    display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 9px;
    border: 1px solid transparent; cursor: default; margin-bottom: 3px;
  }
  .sess:hover { background: var(--panel-2); }
  .sess.cur { background: var(--panel); border-color: var(--line); }
  .sess .nm { flex: 1; min-width: 0; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); flex: none; }
  .badge.wait { color: var(--warn); border-color: var(--warn-dim); background: var(--warn-bg); }
  .badge.run { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-bg); }
  .badge.done { color: var(--ok); border-color: var(--ok-dim); background: var(--ok-bg); }
  .chat { overflow: auto; padding: 22px 26px 90px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 620px; font-size: 13.5px; line-height: 1.65; }
  .msg.me { align-self: flex-end; background: var(--accent-bg); border: 1px solid var(--accent-dim); border-radius: var(--r); padding: 8px 12px; }
  .msg .who { font-size: 11px; color: var(--faint); margin-bottom: 3px; }
  .tool { font-family: var(--mono); font-size: 11.5px; color: var(--dim); background: var(--sunken); border: 1px solid var(--line-soft); border-radius: 9px; padding: 8px 10px; }
  .composer { border-top: 1px solid var(--line-soft); padding: 10px 16px 14px; }
  .box { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 10px 12px; color: var(--faint); font-size: 12.5px; }

  /* ── ★ 行（会话层）：角标就挂在这一行的最右端 ────────────────────────────── */
  .sess-row {
    position: relative; display: flex; align-items: center; gap: 6px; padding: 6px 16px;
    border-bottom: 1px solid var(--line-soft); background: var(--bg);
  }
  .pin-strip { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; overflow: hidden; }
  .pin-chip {
    flex: none; border: 1px solid var(--line-soft); background: var(--panel); color: var(--dim);
    border-radius: 999px; padding: 2px 10px; font-size: 12px; white-space: nowrap;
  }
  .pin-chip.on { border-color: var(--accent-dim); background: var(--accent-bg); color: var(--accent); }

  /* ── 提醒：角标 ──────────────────────────────────────────────────────────── */
  .remind-btn { position: relative; display: inline-flex; align-items: center; gap: 6px; flex: none; }
  .remind-badge {
    min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px;
    background: var(--warn); color: var(--warn-ink, #fff); font-size: 10.5px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .remind-btn[data-count="0"] .remind-badge { display: none; }
  .remind-btn.alert { color: var(--text); }

  /* ── 提醒：清单（同一份 markup，形态由 body[data-variant] 决定） ───────────── */
  .remind-pop {
    position: absolute; z-index: 40; background: var(--panel); color: var(--text);
    border: 1px solid var(--line-strong); border-radius: var(--r);
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22); display: none; overflow: hidden;
  }
  .remind-pop.open { display: flex; flex-direction: column; }
  .pop-head { display: flex; align-items: baseline; gap: 8px; padding: 10px 12px 8px; border-bottom: 1px solid var(--line-soft); }
  .pop-head b { font-size: 12.5px; font-weight: 600; }
  .pop-head .n { font-size: 11px; color: var(--faint); margin-left: auto; }
  .pop-body { overflow: auto; }
  .grp { padding: 7px 12px 3px; font-size: 10.5px; letter-spacing: .04em; color: var(--faint); }
  .row {
    display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px;
    padding: 8px 12px; border-top: 1px solid var(--line-soft); cursor: pointer; align-items: start;
  }
  .row:hover { background: var(--panel-2); }
  .row .ico { font-size: 12px; line-height: 1.45; }
  .row .ttl { font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { font-size: 11.5px; color: var(--dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { font-size: 10.5px; color: var(--faint); white-space: nowrap; padding-top: 1px; font-variant-numeric: tabular-nums; }
  .row .outcome { font-size: 10.5px; color: var(--ok); }
  .row.settled { opacity: .62; }
  .row.settled .ttl { font-weight: 400; }
  .row.stale .outcome { color: var(--faint); }
  .row .mute { border: 0; background: transparent; color: var(--faint); cursor: pointer; font-size: 10.5px; padding: 0; }
  .row .mute:hover { color: var(--danger); text-decoration: underline; }
  .pop-foot { border-top: 1px solid var(--line-soft); padding: 7px 12px; font-size: 11px; color: var(--faint); display: flex; gap: 10px; }
  .pop-foot a { color: var(--accent); text-decoration: none; }

  /* E：按会话分组（结构上不是流水，是一张张会话卡） */
  body[data-variant="E"] .remind-pop { top: calc(100% - 2px); right: 12px; width: 400px; max-height: 66vh; }
  .grpcard { border-top: 1px solid var(--line-soft); padding: 9px 12px 4px; cursor: pointer; }
  .grpcard:hover { background: var(--panel-2); }
  .grpcard .gh { display: flex; align-items: center; gap: 8px; }
  .grpcard .gname { font-size: 12.5px; font-weight: 600; }
  .grpcard .gtime { margin-left: auto; font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .grpcard .gi { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px; padding: 4px 0 4px 2px; font-size: 12px; color: var(--dim); }
  .grpcard .gi .gt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grpcard .gsub { padding: 0 0 5px 22px; font-size: 10.5px; color: var(--faint); }

  body[data-variant="A"] .remind-pop { top: calc(100% - 2px); right: 12px; width: 340px; max-height: 62vh; }
  body[data-variant="B"] .remind-pop { top: calc(100% - 2px); right: 8px; width: 256px; max-height: 66vh; }
  body[data-variant="B"] .row { padding: 6px 10px; grid-template-columns: 14px minmax(0, 1fr) auto; }
  body[data-variant="B"] .row .sub { display: none; }
  body[data-variant="B"] .row:hover .sub { display: block; }

  /* C：右侧窄抽屉，贴着视口右缘（不是挂在 topbar 里），窄屏盖全宽 */
  body[data-variant="C"] .remind-pop {
    position: fixed; top: 0; right: 0; bottom: 0; width: 320px; max-height: none;
    border-radius: 0; border-right: 0; border-top: 0; border-bottom: 0;
  }
  body[data-variant="C"] .pop-body { flex: 1; }

  /* D：角标 / 位置都不变，只把面板换成一整条贴着输入框的宽面板，列表走两栏 */
  body[data-variant="D"] .remind-pop {
    position: fixed; left: 16px; right: 16px; bottom: 84px; width: auto; max-height: 46vh;
  }
  body[data-variant="D"] .pop-body { display: grid; grid-template-columns: 1fr 1fr; align-content: start; column-gap: 8px; }
  body[data-variant="D"] .pop-body > .grp { grid-column: 1 / -1; }

  /* ── 提醒：吐司（右上角，自己消失，悬停暂停） ────────────────────────────── */
  .toasts { position: fixed; top: 146px; right: 16px; z-index: 60; display: flex; flex-direction: column; gap: 8px; width: 320px; }
  .toast {
    display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px; align-items: start;
    background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px;
    padding: 9px 11px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.24); animation: in var(--dur-2) var(--ease);
  }
  @keyframes in { from { opacity: 0; transform: translateY(-6px); } }
  .toast .ttl { font-size: 12.5px; font-weight: 500; }
  .toast .sub { font-size: 11.5px; color: var(--dim); margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .toast .go { border: 0; background: transparent; color: var(--accent); font-size: 11.5px; cursor: pointer; padding: 0; }

  /* ── 原型自己的浮条（真实产品不会长这样） ───────────────────────────────── */
  .proto-bar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; z-index: 90;
    display: flex; align-items: center; gap: 6px; padding: 7px 9px; border-radius: 999px;
    background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line-strong);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18); backdrop-filter: blur(10px); font-size: 12px;
  }
  .proto-bar .lab { color: var(--faint); font-size: 11px; padding: 0 4px; }
  .proto-bar .v {
    border: 1px solid var(--line); background: var(--panel); color: var(--dim);
    width: 26px; height: 26px; border-radius: 999px; cursor: pointer; font-size: 13px; padding: 0; line-height: 1;
  }
  .proto-bar .v:hover { border-color: var(--accent); color: var(--accent); }
  .proto-bar .cur { font-size: 12px; color: var(--text); min-width: 176px; text-align: center; }
  .proto-bar .t { border: 1px solid var(--line); background: var(--panel); color: var(--dim); border-radius: 999px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  .proto-bar .lab, .proto-bar .cur { white-space: nowrap; }
  @media (max-width: 760px) { .proto-bar { flex-wrap: wrap; justify-content: center; max-width: calc(100% - 24px); row-gap: 6px; } }
  .proto-bar .t:hover { border-color: var(--accent); color: var(--accent); }
  .proto-bar .t.on { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

  /* 清单打开时收起说明盒，免得两个浮层打架 */
  body:has(#remindPop.open) .bet { display: none; }
  .bet {
    position: fixed; left: 16px; bottom: 76px; z-index: 80; max-width: 420px;
    background: var(--panel); border: 1px dashed var(--line-strong); border-radius: 10px;
    padding: 8px 11px; font-size: 11.5px; color: var(--dim); line-height: 1.6;
  }
  .bet b { color: var(--text); }
</style>
</head>
<body data-variant="A">

<div class="app">
  <header class="topbar">
    <button class="tbtn icobtn">◧</button>
    <span class="title">api 重构</span>
    <span class="spacer"></span>
    <button class="tbtn">📁 文件</button>
    <button class="tbtn">>_ 终端</button>
    <button class="tbtn">🌐 内网通</button>
    <button class="tbtn">🐞 bug</button>

    <button class="tbtn">⚙ 外观</button>
    <button class="tbtn icobtn">◨</button>

  </header>

  <nav class="ws-tabs">
    <span class="ws-tab on">pi-web-client</span>
    <span class="ws-tab">api</span>
    <span class="ws-tab">go-svc</span>
    <span class="ws-tab">＋5</span>
  </nav>

  <!-- ★ 行（会话层）：右上角那颗角标挂在这一行的最右端，不占顶栏 -->
  <div class="sess-row">
    <div class="pin-strip">
      <span class="pin-chip on">api 重构</span>
      <span class="pin-chip">go-svc 迁移</span>

    <button class="tbtn remind-btn alert" data-count="2" id="remindBtn" title="等你的事">

    <button class="tbtn icobtn" title="置顶">＋</button>
    <div class="remind-pop" id="remindPop" role="dialog" aria-label="等你的事">
      <div class="pop-head"><b>等你的事</b><span class="n" id="popCount">2 件在等你</span></div>
      <div class="pop-body" id="popBody"></div>

  <main class="main">
    <aside class="side">

      <div class="sess" data-sid="s3"><span class="nm">日志排查</span><span class="badge done">完成</span></div>
      <div class="sess" data-sid="s4"><span class="nm">README 中英对照</span></div>
    </aside>
    <section class="chat">
      <div class="msg"><div class="who">你</div>把这几个 util 拆出去，别动 API。</div>
      <div class="msg"><div class="who">pi</div>拆完了，`build` 想清一下 `dist/` 再跑，要你点一下。</div>
      <div class="tool">$ rm -rf dist/ &amp;&amp; npm run build</div>
      <div class="msg me"><div class="who">你</div>稍等，我先把这个 PR 看完。</div>
    </section>
  </main>

  <footer class="composer">
    <div class="box">问点什么，或 / 命令 · <span style="color:var(--faint)">这里只是摆设</span></div>
  </footer>
</div>

<div class="toasts" id="toasts"></div>

<div class="bet" id="bet"></div>

<div class="proto-bar">
  <span class="lab">原型 · 一次性</span>
  <button class="v" id="prevV" title="上一个变体（←）">‹</button>
  <span class="cur" id="curV">A · 顶栏角标 + 下拉清单</span>
  <button class="v" id="nextV" title="下一个变体（→）">›</button>
  <span class="lab">|</span>
  <button class="t" id="btnToast">弹一条吐司</button>
  <button class="t" id="btnNarrow">窄版</button>
  <button class="t" id="btnDark">深色</button>
</div>

<script type="module">
/* 死数据。形状照 docs/PLAN-reminders.md 的 Reminder。 */
const REMINDERS = [
  { id: "r1", kind: "approval", sessionId: "s1", sessionName: "api 重构", title: "需要你批准 · api 重构", body: "rm -rf dist/ && npm run build", at: -2, state: "waiting" },

  { id: "r3", kind: "notice", sessionId: undefined, sessionName: "构建", title: "prisma 迁移失败", body: "exit 1：relation \"users\" already exists", at: -20, state: "read", outcome: "read" },
  { id: "r4", kind: "approval", sessionId: "s3", sessionName: "日志排查", title: "需要你批准 · 日志排查", body: "git push origin main", at: -63, state: "handled", outcome: "approved" },
  { id: "r5", kind: "ask", sessionId: "s1", sessionName: "api 重构", title: "需要你回答 · api 重构", body: "要不要顺手把 CI 也改了？", at: -26 * 60, state: "handled", outcome: "answered" },
];

const BETS = {
  A: "<b>A · 会话行右侧 + 下拉清单</b><br>赌「情报比操作重要」：角标钉在 ★ 行右端（不挤顶栏那 10 颗），点开是 340px 的两行清单，只负责让你知道、跳过去，不复制审批 UI。",
  B: "<b>B · 同一个位置 + 极密列表</b><br>赌「你一屏能扫完」：单行只留标题与时间，正文悬停才出。看得多、认得快，但「rm -rf dist/」这种要点得先悬停才敢点。",
  C: "<b>C · 右侧窄抽屉</b><br>赌「你愿意腾出 320px」：清单固定不随顶栏滚走，能停在那儿一格一格处理。代价是窄屏要么全宽盖住正文，要么干脆不出。",
  D: "<b>D · 从底部升起的宽面板</b><br>赌「一屏看完」：角标还在 ★ 行，点开后不开小下拉，而是在输入框上方升起一整条两栏面板 —— 条目多时最省滚动；代价是它盖住正文底部，读长文时最碍事。",
  E: "<b>E · 按会话分组</b><br>赌「你关心的是哪个会话，不是哪一条」：一张会话卡里装它全部的等待（待确认 2 + 待回答 1），点卡 = 切过去。会话一多卡就少；但跨会话的「最近的先看」就读不出来了。",
};

const $ = (s, r = document) => r.querySelector(s);
const state = { variant: "A", open: false, narrow: false, dark: false };
const NAMES = { A: "会话行右侧 + 下拉清单", B: "会话行右侧 + 极密列表", C: "右侧窄抽屉", D: "底部升起的宽面板", E: "按会话分组" };

function rel(at) {
  if (at > -60) return `${Math.abs(at)} 分钟前`;
  if (at > -1440) return `${Math.round(Math.abs(at) / 60)} 小时前`;
  return "昨天";
}
function outcomeText(r) {
  if (r.outcome === "approved") return "已批准";
  if (r.outcome === "rejected") return "已拒绝";
  if (r.outcome === "answered") return "已回答";
  if (r.outcome === "read") return "已读";
  if (r.outcome === "stale") return "已失效";
  return "";
}
const ICON = { approval: "⚠", ask: "❓", notice: "•" };

function renderList() {
  const waiting = REMINDERS.filter((r) => r.state === "waiting");
  const done = REMINDERS.filter((r) => r.state !== "waiting");
  const row = (r, settled) => `
    <div class="row${settled ? " settled" : ""}${r.outcome === "stale" ? " stale" : ""}" data-id="${r.id}">
      <span class="ico" aria-hidden="true">${ICON[r.kind]}</span>
      <span>
        <div class="ttl">${r.title}</div>
        <div class="sub">${r.body}</div>
        ${settled ? "" : `<div class="sub" style="color:var(--faint)">${r.sessionName} · <button class="mute" data-mute="${r.sessionId ?? ""}">静音这个会话</button></div>`}
      </span>
      <span class="meta">${settled ? `<span class="outcome">${outcomeText(r)}</span><br>` : ""}${rel(r.at)}</span>
    </div>`;

  /* E 不是流水：按会话把在等的装成一张张卡，再往下才是已处理 */
  const grouped = () => {
    const by = new Map();
    for (const r of waiting) {
      const k = r.sessionId ?? "_other";
      if (!by.has(k)) by.set(k, []);
      by.get(k).push(r);
    }
    const cards = [...by.values()]
      .map((rows) => {
        const first = rows[0];
        const na = rows.filter((r) => r.kind === "approval").length;
        const nq = rows.filter((r) => r.kind === "ask").length;
        const tag = [na ? `待确认 ${na}` : "", nq ? `待回答 ${nq}` : ""].filter(Boolean).join(" · ");
        const lines = rows.map((r) => `<div class="gi"><span aria-hidden="true">${ICON[r.kind]}</span><span class="gt">${r.body}</span></div>`).join("");
        const mute = first.sessionId ? ` · <button class="mute" data-mute="${first.sessionId}">静音这个会话</button>` : "";
        return `<div class="grpcard" data-id="${first.id}"><div class="gh"><span class="gname">${first.sessionId ? first.sessionName : "其它"}</span><span class="badge wait">${tag}</span><span class="gtime">${rel(first.at)}</span></div>${lines}<div class="gsub">点卡 = 切过去并滚到那张卡${mute}</div></div>`;
      })
      .join("");
    const settled = done.map((r) => row(r, true)).join("");
    return (waiting.length ? cards : `<div class="grp">没有在等你的了</div>`) + (settled ? `<div class="grp">今天 / 昨天</div>${settled}` : "");
  };

  $("#popBody").innerHTML = state.variant === "E" ? grouped() : [
    waiting.length ? `<div class="grp">等你 · ${waiting.length}</div>` + waiting.map((r) => row(r, false)).join("") : `<div class="grp">没有在等你的了</div>`,
    done.length ? `<div class="grp">今天</div>` + done.filter((r) => r.at > -1440).map((r) => row(r, true)).join("") : "",
    done.some((r) => r.at <= -1440) ? `<div class="grp">昨天</div>` + done.filter((r) => r.at <= -1440).map((r) => row(r, true)).join("") : "",
  ].join("");
  $("#popCount").textContent = waiting.length ? `${waiting.length} 件在等你` : "都处理完了";
  /* 左栏的「待确认 N」跟着同一份数据走，否则两张截图里的数字对不上 */
  for (const el of document.querySelectorAll(".sess[data-sid]")) {
    const mine = waiting.filter((r) => r.sessionId === el.dataset.sid);
    el.querySelector(".badge.wait")?.remove();
    if (!mine.length) continue;
    const na = mine.filter((r) => r.kind === "approval").length;
    const nq = mine.filter((r) => r.kind === "ask").length;
    const b = document.createElement("span");
    b.className = "badge wait";
    b.textContent = [na ? (na > 1 ? `待确认 ${na}` : "待确认") : "", nq ? "待回答" : ""].filter(Boolean).join(" · ");
    el.append(b);
  }
  $("#remindBadge").textContent = String(waiting.length);
  $("#remindBtn").dataset.count = String(waiting.length);
}

function toast(title, body) {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span aria-hidden="true">⚠</span><span><div class="ttl">${title}</div><div class="sub">${body}</div></span><button class="go">去看看</button>`;
  let timer = setTimeout(close, 6000);
  el.addEventListener("pointerenter", () => clearTimeout(timer));
  el.addEventListener("pointerleave", () => { timer = setTimeout(close, 2000); });
  el.querySelector(".go").addEventListener("click", () => { setOpen(true); close(); });
  function close() { clearTimeout(timer); el.remove(); }
  const box = $("#toasts");
  box.append(el);
  while (box.children.length > 3) box.firstElementChild.remove();
}

function setOpen(on) {
  state.open = on;
  $("#remindPop").classList.toggle("open", on);
}

function applyVariant(v) {
  const keys = Object.keys(BETS);
  if (!keys.includes(v)) v = "A";
  state.variant = v;
  document.body.dataset.variant = v;
  $("#curV").textContent = `${v} · ${NAMES[v]}`;
  $("#bet").innerHTML = BETS[v] ?? "";
  renderList();
  setOpen(false);
  const url = new URL(location.href);
  url.searchParams.set("variant", v);
  history.replaceState(null, "", url);
}

function step(delta) {
  const keys = Object.keys(BETS);
  const i = keys.indexOf(state.variant);
  applyVariant(keys[(i + delta + keys.length) % keys.length]);
}

/* ── 接线 ─────────────────────────────────────────────────────────────────── */
$("#remindBtn").addEventListener("click", (e) => { e.stopPropagation(); setOpen(!state.open); });
document.addEventListener("click", (e) => {
  if (!state.open) return;
  if (e.target.closest("#remindPop") || e.target.closest("#remindBtn")) return;
  setOpen(false);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") setOpen(false); });

$("#popBody").addEventListener("click", (e) => {
  const mute = e.target.closest("[data-mute]");
  if (mute) {
    e.stopPropagation();
    const sid = mute.dataset.mute;
    for (const r of REMINDERS) if (r.sessionId === sid && r.state === "waiting") r.state = "muted";
    renderList();
    return;
  }
  const row = e.target.closest(".row, .grpcard");
  if (!row) return;
  const r = REMINDERS.find((x) => x.id === row.dataset.id);
  if (!r || r.state !== "waiting") return;
  /* 「切过去并滚到那张卡」：原型里只把那颗会话闪一下，说明落点是会话，不是清单 */
  const s = document.querySelectorAll(".sess")[r.kind === "approval" ? 0 : 1];
  s?.animate([{ background: "var(--accent-bg)" }, { background: "transparent" }], { duration: 900, iterations: 2 });
  setOpen(false);
});

document.querySelectorAll(".proto-bar .v").forEach((b) => b.addEventListener("click", () => applyVariant(b.dataset.v)));
$("#prevV").addEventListener("click", () => step(-1));
$("#nextV").addEventListener("click", () => step(1));
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
$("#btnToast").addEventListener("click", () => toast("需要你批准 · api 重构", "rm -rf dist/ && npm run build"));
$("#btnNarrow").addEventListener("click", (e) => {
  state.narrow = !state.narrow;
  e.currentTarget.classList.toggle("on", state.narrow);
  /* 窄版：把左栏收掉，看清单在窄屏里怎么活（真产品要用 @container，不是 @media） */
  $(".main").style.gridTemplateColumns = state.narrow ? "0 minmax(0, 1fr)" : "240px minmax(0, 1fr)";
  $(".side").style.display = state.narrow ? "none" : "";
  $(".topbar").style.fontSize = state.narrow ? "12px" : "";
});
$("#btnDark").addEventListener("click", (e) => {
  state.dark = !state.dark;
  e.currentTarget.classList.toggle("on", state.dark);
  document.documentElement.dataset.theme = state.dark ? "dark" : "";
  document.documentElement.style.colorScheme = state.dark ? "dark" : "light";
});

renderList();
applyVariant(new URL(location.href).searchParams.get("variant") || "A");
/* 一打开就看见吐司是什么感觉 —— 这就是这份原型要你别脑补的那一下 */
if (new URL(location.href).searchParams.get("toast") !== "0") setTimeout(() => toast("需要你批准 · api 重构", "rm -rf dist/ && npm run build"), 600);
</script>
</body>
</html>
