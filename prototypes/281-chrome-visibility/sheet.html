<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>原型 · 按钮可见性（外观与语言 sheet）</title>
    <link rel="stylesheet" href="./app.css" />
    <link rel="stylesheet" href="./proto.css" />
  </head>
  <body>
    <div id="app">
      <div class="app">
        <!-- 真外壳：这一页的大部分价值在于「新段放在真页面里长什么样」 -->
        <header class="topbar">
          <span class="dot"></span>
          <div class="title">pi</div>
          <div class="sub">F:/pi-web-client</div>
          <button class="icon-btn wide"><span class="ic">📂</span><span class="lb">产物</span></button>
          <button class="icon-btn wide"><span class="ic">&gt;_</span><span class="lb">终端</span></button>
          <button class="icon-btn wide"><span class="ic">📁</span><span class="lb">文件管理器</span></button>
          <button class="icon-btn wide notes-btn"><span class="ic">🐞</span><span class="lb">bug</span></button>
          <button class="icon-btn wide"><span class="ic">🌐</span><span class="lb">内网通</span></button>
          <button class="icon-btn wide"><span class="ic">💭</span><span class="lb">随手问</span></button>
          <button class="icon-btn wide"><span class="ic">🔷</span><span class="lb">Jira</span></button>
          <button class="icon-btn icon-text" data-open>Aa</button>
        </header>

        <div class="main">
          <section class="pane chat-pane">
            <div class="chat-scroll">
              <div class="proto-bubble">
                顶栏这一排 8 颗、输入框下沿 4 颗，现在一个都关不掉。手机上放不下的时候，只能等 CSS
                自己把「文件管理器」藏起来。
              </div>
              <div class="proto-bubble me">那就让它们各自能被关掉，关掉的空间还回去。</div>
              <div class="proto-bubble">
                在「外观与语言」里多一组勾选，桥端存一份——换浏览器、换手机打开都是同一份。
              </div>
            </div>
            <div class="composer">
              <div class="row">
                <textarea rows="2" placeholder="继续说…"></textarea>
              </div>
              <div class="hint">
                <div class="hint-status">F:/pi-web-client · main</div>
                <div class="hint-tools">
                  <button class="btn ghost">技能</button>
                  <button class="btn ghost">扩展</button>
                  <button class="btn ghost">文件</button>
                  <button class="model-chip">
                    <span class="chip-model">claude-sonnet</span><span class="chip-ctx">200k</span>
                  </button>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>

    <!-- 真的「外观与语言」sheet：上半段是现有的组，下半段是待选的三种画法 -->
    <div class="sheet-back">
      <div class="sheet display-sheet">
        <div class="sheet-head">
          <div class="sheet-title">外观与语言</div>
          <button class="btn ghost" data-close>关闭</button>
        </div>

        <div class="levels">
          <div class="levels-label">语言</div>
          <div class="chips">
            <button class="chip on">中文</button>
            <button class="chip">English</button>
            <button class="chip">日本語</button>
          </div>
        </div>

        <div class="levels">
          <div class="vis-head"><div class="levels-label">字号</div><span class="vis-note">100%</span></div>
          <input class="proto-range" type="range" min="0.85" max="2" step="0.05" value="1" />
        </div>

        <div class="levels">
          <div class="levels-label">颜色</div>
          <div class="swatches">
            <button class="swatch on" style="--sw: #7dd3fc"></button>
            <button class="swatch" style="--sw: #7ee7c7"></button>
            <button class="swatch" style="--sw: #b9a5ff"></button>
            <button class="swatch" style="--sw: #f2a6c0"></button>
            <button class="swatch" style="--sw: #f0c674"></button>
            <button class="swatch" style="--sw: #d8dee9"></button>
          </div>
        </div>

        <div class="levels">
          <div class="levels-label">文字亮度</div>
          <div class="chips">
            <button class="chip">柔和</button>
            <button class="chip on">标准</button>
            <button class="chip">明亮</button>
          </div>
        </div>

        <div class="levels">
          <div class="levels-label">工作区布局</div>
          <div class="chips">
            <button class="chip on">A 两行制</button>
            <button class="chip">B 单行</button>
            <button class="chip">C 左轨</button>
            <button class="chip">D 右轨</button>
          </div>
        </div>

        <div class="levels">
          <div class="vis-head"><div class="levels-label">标签行</div><span class="vis-note">最多显示 6</span></div>
          <div class="proto-step">
            <button class="btn ghost">−</button><span class="n">6</span><button class="btn ghost">＋</button>
            <span class="vis-note">标签行的名额存在桥端，换浏览器打开还是同一个数。</span>
          </div>
        </div>

        <!-- 新段：由 proto.js 按 ?variant= 画 -->
        <div id="slot"></div>

        <div class="sheet-foot">
          <button class="btn ghost">恢复默认</button>
        </div>
      </div>
    </div>

    <div id="proto-bar">
      <button id="pv-prev" title="上一个（←）">←</button>
      <span class="pv-label" id="pv-label">A</span>
      <button id="pv-next" title="下一个（→）">→</button>
      <a href="./index.html">目录</a>
    </div>

    <script src="./proto.js"></script>
  </body>
</html>
