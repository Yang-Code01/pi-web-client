<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>内网通 · pi</title>
    <link rel="stylesheet" href="/src/peer/peer.css" />
  </head>
  <body>
    <!-- 骨架全部由 `src/peer/main.ts` 渲染（页面有四页、三种宽度形态，写死在 HTML 里只会来回打架）。
         这里只留固定挂载点，以及文件选择器这个带 id 的长表单。 -->
    <div id="app" class="app" data-page="msg" data-mview="list">
      <div id="bar" class="bar"></div>
      <div id="hint" class="hint"></div>
      <nav id="rail" class="rail"></nav>
      <section id="list" class="list"></section>
      <section id="main" class="main"></section>
      <nav id="mobnav" class="mobnav"></nav>
    </div>

    <!-- 文件选择器：照资源管理器的样子（面包屑 + 常用位置 + 盘符 + 列表）。只在本机 loopback 上列目录。 -->
    <div id="picker" class="picker" hidden>
      <div class="pbox" role="dialog" aria-label="选择要发送的文件" data-i18n-aria="选择要发送的文件">
        <header class="phead">
          <strong data-i18n="选择文件">选择文件</strong>
          <span id="picker-hint" class="sub" data-i18n="点文件夹进入，点文件名选中">点文件夹进入，点文件名选中</span>
          <button type="button" id="picker-close" class="icon-btn" title="关掉" data-i18n-title="关掉" aria-label="关掉"></button>
        </header>
        <nav id="crumbs" class="crumbs"></nav>
        <div class="pbody">
          <aside class="pside">
            <p data-i18n="常用">常用</p>
            <ul id="places"></ul>
            <p data-i18n="这台电脑">这台电脑</p>
            <ul id="roots"></ul>
          </aside>
          <ul id="files" class="files"></ul>
        </div>
        <footer class="pfoot">
          <span id="picker-sel" class="sel" data-i18n="还没选文件">还没选文件</span>
          <button type="button" id="picker-up" class="btn" data-i18n="上一层">上一层</button>
          <button type="button" id="picker-send" class="btn pri" disabled data-i18n="发送">发送</button>
        </footer>
      </div>
    </div>

    <div id="layer" class="layer"></div>
    <div id="toast" class="toast"></div>

    <script type="module" src="/src/peer/main.ts"></script>
  </body>
</html>
