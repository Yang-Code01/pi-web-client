<!doctype html>
<!--
  PROTOTYPE — 一次性原型，不进 main。分支 proto/repos-dialog。
  问题：「目录与仓库」窗口里，目录树 / 仓库状态 / 工作台三块信息怎么排最顺手？
       三个结构不同的变体，用 ?variant=A|B|C 或底部切换条（← →）切换。
  数据全是脚本模拟的（E:/yqm/erp 伞形目录 + 3 个子仓库），不连桥。
  打开方式：直接双击本文件（file:// 可用），或 npm --prefix web run dev 后访问 /prototype/repos-dialog.html。
  已定共识（见 issue #392）：非 git 工作目录时左下角路径 chip 弹本窗；在仓库里仍复制路径。
   · 左目录树（根 = cwd，可 ↑ 上级越出子树，懒加载，隐藏 . 开头与 node_modules）
   · 展开一层批量探测，只有 toplevel == 自身才算仓库，标 ⎇ 分支 + dirty（不计未跟踪）
   · 右栏按「选中目录所在仓库」取数，深于仓库根时标「选中：src」
   · 写操作沿用老工作台（动词 / 交给 AI），分支工作台那块（含「分支·本地+远程」栏）原样保留
   · 空态：未选 / 不是仓库 / 目录里有仓库；窄屏左树收成抽屉
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>原型 · 目录与仓库</title>
<style>
:root {
  --bg:#0b0d10; --sunken:#0a0e13; --panel:#12151a; --panel-2:#171b22; --panel-3:#1c2129;
  --line:#232833; --line-soft:#1b2028; --line-strong:#2f3a48; --line-lit:#3a4658;
  --text:#e7eaf0; --dim:#9aa2b1; --faint:#8b93a1;
  --accent:#7dd3fc; --accent-bg:#0e2a36; --accent-dim:#0e3a4d;
  --ok:#4ade80; --ok-bg:#0d2016; --ok-dim:#1d3a2a;
  --warn:#fbbf24; --warn-bg:#241d0a; --warn-dim:#3a2f14;
  --danger:#fb7185; --danger-bg:#2a1016; --danger-dim:#40222a;
  --mono: ui-monospace,"Cascadia Mono",Consolas,monospace;
  --sans: -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --r:12px; --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.55 var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)} .faint{color:var(--faint)} .small{font-size:11px}
.spacer{flex:1}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ================= 外壳：模仿真实三栏，给弹窗一个上下文 ================= */
.shell{display:grid;grid-template-rows:40px 1fr;height:100%}
.topbar{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12.5px}
.topbar b{font-weight:600}
.topbar .tagp{border:1px solid var(--warn-dim);background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:1px 8px;font-size:11px}
.main{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:0}
.sessions{padding:10px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
.sessions .sh{font-size:11px;color:var(--faint);padding:2px 4px 8px}
.scard{padding:7px 9px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--panel-2);font-size:12px}
.scard.cur{border-color:var(--accent-dim);background:var(--panel-3)}
.scard .p{color:var(--faint);font-family:var(--mono);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat{display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow:auto;padding:18px 26px 8px}
.msg{margin:10px 0;max-width:680px;font-size:13.5px}
.msg.user{margin-left:auto;background:var(--panel-3);padding:7px 12px;border-radius:12px;width:fit-content}
.msg.ai{color:var(--dim)}
.composer{border-top:1px solid var(--line);background:var(--panel);padding:6px 12px 10px}
.status{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--faint);padding:3px 0 5px}
.cwdchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-lit);background:var(--panel-2);border-radius:999px;padding:1px 9px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.cwdchip:hover{color:var(--text);border-color:var(--accent-dim);background:var(--accent-bg)}
.cwdchip .hint{color:var(--accent);font-family:var(--sans)}
.inputbox{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);padding:8px 10px;display:flex;align-items:flex-end;gap:8px}
.inputbox .ph{flex:1;color:var(--faint);font-size:13px;padding:2px 0}
.inputbox .send{width:26px;height:26px;border-radius:8px;background:var(--accent-dim);color:#cdeefd;display:grid;place-items:center;font-size:13px}

/* ================= 弹窗骨架 ================= */
.back{position:fixed;inset:0;background:rgba(4,6,9,.62);display:grid;place-items:center;padding:22px 22px 82px;z-index:20;backdrop-filter:blur(2px)}
.sheet{position:relative;width:min(1180px,96vw);height:min(780px,84vh);display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.03) inset}
.shead{flex:0 0 auto;display:flex;align-items:center;gap:10px;height:46px;padding:0 12px 0 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.shead .t{font-size:13.5px;font-weight:600}
.shead .pfx{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px 8px;max-width:52ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shead .tg{border:1px solid var(--warn-dim);background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:0 8px;font-size:11px}
.shead .tg.ok{border-color:var(--ok-dim);background:var(--ok-bg);color:var(--ok)}
.btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:3px 9px;font-size:12px;color:var(--text);white-space:nowrap}
.btn:hover{border-color:var(--line-lit);background:var(--panel-3)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn.ghost:hover{background:var(--panel-3);color:var(--text);border-color:var(--line)}
.btn.pri{background:var(--accent-dim);border-color:#2b5568;color:#d3f0fe}
.btn.pri:hover{background:#12455c}
.btn.icon{width:26px;height:26px;justify-content:center;padding:0;font-size:13px}
.sbody{flex:1;min-height:0;display:grid}
.sbody.cols2{grid-template-columns:252px minmax(0,1fr)}
.sbody.cols3{grid-template-columns:224px 214px minmax(0,1fr)}
.sbody.rows2{grid-template-rows:auto minmax(0,1fr)}

/* 目录树 */
.tree{display:flex;flex-direction:column;min-height:0;background:var(--sunken);border-right:1px solid var(--line)}
.tree-head{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line-soft)}
.mini{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:1px 8px;font-size:11.5px;color:var(--dim)}
.mini:hover{color:var(--text);border-color:var(--line-lit)}
.tree-scroll{flex:1;overflow:auto;padding:4px 0 8px}
.trow{display:flex;align-items:center;gap:5px;height:26px;padding-right:8px;cursor:pointer;color:var(--dim);border-left:2px solid transparent}
.trow:hover{background:var(--panel-2);color:var(--text)}
.trow.sel{background:var(--panel-2);color:var(--text);border-left-color:var(--accent)}
.trow .caret{width:13px;flex:0 0 13px;color:var(--faint);font-size:10px;text-align:center}
.trow .tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow.repo .tname{color:var(--text)}
.trow .tbr{font-family:var(--mono);font-size:10.5px;color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-dim);border-radius:6px;padding:0 5px}
.trow .tdirty{font-size:10.5px;color:var(--warn)}
.trow .tnr{font-size:10px;color:var(--faint);opacity:.75}
.tload{padding:3px 0 3px 22px;font-size:11px;color:var(--faint);font-family:var(--mono)}
.tree-foot{padding:6px 10px;border-top:1px solid var(--line-soft);font-size:10.5px;color:var(--faint)}

/* 面板 */
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.pline{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line-soft);min-width:0}
.rname{font-weight:600;font-size:13px}
.bchip{font-size:11.5px;color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-dim);border-radius:7px;padding:1px 7px}
.dirty{font-size:11px;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-dim);border-radius:7px;padding:1px 6px}
.clean{font-size:11px;color:var(--ok)}
.selnote{font-size:11px;color:var(--faint);border:1px dashed var(--line-strong);border-radius:7px;padding:0 7px}
.verbs{display:flex;align-items:center;gap:6px;padding:7px 14px;border-bottom:1px solid var(--line-soft);overflow:auto}
.cmp{display:flex;align-items:center;gap:6px;padding:6px 14px;font-size:11.5px;color:var(--faint);border-bottom:1px solid var(--line-soft)}
.chip{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--dim);background:var(--panel-2)}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line)}
.tab{padding:5px 12px;border-radius:8px 8px 0 0;color:var(--dim);font-size:12.5px}
.tab:hover{color:var(--text);background:var(--panel-2)}
.tab.on{color:var(--text);background:var(--panel-2);box-shadow:inset 0 -2px 0 var(--accent)}
.pbody{flex:1;min-height:0;overflow:auto;padding:8px 14px 12px}
.pbody.pad{padding:14px}
.pfoot{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 14px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--faint)}

.hgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 208px;height:100%;min-height:0}
.hgrid.noaside{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.ccol{padding:2px 10px 8px 0;min-width:0;overflow:auto}
.ccol + .ccol{border-left:1px solid var(--line-soft);padding-left:12px}
.ccap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--faint);padding:4px 0 7px;position:sticky;top:0;background:var(--panel)}
.ccap b{color:var(--dim);font-weight:500}
.commit{display:grid;grid-template-columns:60px minmax(0,1fr);gap:8px;padding:5px 6px;border-radius:7px}
.commit:hover{background:var(--panel-2)}
.commit .h{font-size:11px;color:var(--accent)}
.commit .s{font-size:12px;min-width:0}
.commit .s .line{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.commit .s .meta{font-size:10.5px;color:var(--faint);margin-top:1px}
.commit.same{background:var(--panel-3)}
.sametag{font-size:10px;color:var(--ok);border:1px solid var(--ok-dim);border-radius:5px;padding:0 4px;margin-left:5px;vertical-align:1px}

.bside{border-left:1px solid var(--line);overflow:auto;padding:6px 8px 10px;font-size:12px;background:var(--panel)}
.bside h4{margin:6px 2px 5px;font-size:10.5px;font-weight:600;color:var(--faint);letter-spacing:.02em}
.brow{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:6px;font-family:var(--mono);font-size:11px;color:var(--dim);cursor:pointer}
.brow:hover{background:var(--panel-2);color:var(--text)}
.brow.cur{background:var(--panel-3);color:var(--text);box-shadow:inset 2px 0 0 var(--ok)}
.bside .cta{width:100%;justify-content:center;margin-top:6px;font-size:11.5px}

/* 空态 */
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:26px 18px;color:var(--dim);font-size:12.5px}
.empty .big{font-size:13.5px;color:var(--text)}
.empty .mono.path{color:var(--dim);font-size:11.5px}
.empty .repolist{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.empty .repolist .btn{font-family:var(--mono);font-size:11px}
.empty .norepo{font-size:11.5px;color:var(--faint);border-left:2px solid var(--line-strong);padding-left:9px}

/* 差异 / 手册 tab */
.files{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.file{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;padding:3px 6px;border-radius:6px}
.file:hover{background:var(--panel-2)}
.file .st{width:14px;color:var(--warn);text-align:center}
.file .st.new{color:var(--ok)}
.file .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .c{font-size:11px}
.file .c .p{color:var(--ok)} .file .c .m{color:var(--danger)}
.hunk{border:1px solid var(--line);border-radius:8px;overflow:hidden;font-family:var(--mono);font-size:11px;background:var(--sunken)}
.hunk .hh{padding:2px 8px;color:var(--faint);border-bottom:1px solid var(--line-soft);background:var(--panel-2)}
.hunk .l{padding:0 8px;white-space:pre;overflow-x:auto}
.hunk .l.p{background:var(--ok-bg);color:#bdf5cf}
.hunk .l.m{background:var(--danger-bg);color:#ffc7d1}
.hunk .l.ctx{color:var(--dim)}
.manblock{border-left:2px solid var(--line-strong);padding:2px 0 2px 10px;margin-bottom:12px;font-size:12.5px;color:var(--dim)}
.manblock b{color:var(--text);display:block;margin-bottom:2px;font-weight:600}
.manblock code{font-family:var(--mono);font-size:11px;background:var(--panel-3);border-radius:4px;padding:0 4px;color:var(--accent)}

/* ===== 变体 B：仓库标签条 + 目录浮层 ===== */
.rtabs{display:flex;align-items:center;gap:4px;padding:7px 10px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--panel-2)}
.rtab{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:12px;color:var(--dim);white-space:nowrap}
.rtab:hover{color:var(--text);border-color:var(--line-lit)}
.rtab.on{color:var(--text);border-color:var(--accent-dim);background:var(--panel-3);box-shadow:inset 0 -2px 0 var(--accent)}
.rtab .b{font-size:10.5px;color:var(--accent)}
.rtab .d{width:5px;height:5px;border-radius:50%;background:var(--warn)}
.rtab.add{border-style:dashed;color:var(--faint)}
.dirover{position:absolute;inset:0;background:rgba(5,7,10,.6);display:flex;justify-content:center;align-items:flex-start;padding:20px;z-index:8}
.dirover-card{display:flex;flex-direction:column;width:min(420px,100%);max-height:calc(100% - 8px);background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.dirover-head{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.dirover-head input{flex:1;background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--text);font:12px var(--sans);padding:4px 8px;outline:none}
.dirover-head input:focus{border-color:var(--line-lit)}
.dirover-tree{flex:1;overflow:auto;padding:4px 0}
.dirover-foot{padding:6px 10px;border-top:1px solid var(--line-soft);font-size:10.5px;color:var(--faint)}
.flatrow{display:flex;align-items:center;gap:6px;padding:4px 10px;font-size:12px;color:var(--dim);cursor:pointer}
.flatrow:hover{background:var(--panel-2);color:var(--text)}
.flatrow .pfx{font-size:10.5px;color:var(--faint);font-family:var(--mono)}

/* ===== 变体 C：仓库摘要栏 + 分支下拉 ===== */
.rail{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.rail-head{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:11px;color:var(--faint);border-bottom:1px solid var(--line-soft)}
.rail-scroll{flex:1;overflow:auto;padding:6px}
.rcard{border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin-bottom:6px;background:var(--panel-2);cursor:pointer;font-size:12px}
.rcard:hover{border-color:var(--line-lit)}
.rcard.on{border-color:var(--accent-dim);background:var(--panel-3);box-shadow:inset 2px 0 0 var(--accent)}
.rcard .top{display:flex;align-items:center;gap:6px}
.rcard .top b{font-weight:600;font-size:12px}
.rcard .top .d{width:5px;height:5px;border-radius:50%;background:var(--warn)}
.rcard .b{font-family:var(--mono);font-size:10.5px;color:var(--accent);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .m{font-size:10.5px;color:var(--faint);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-foot{padding:6px 10px;border-top:1px solid var(--line-soft);font-size:10.5px;color:var(--faint)}
.popwrap{position:relative}
.pop{position:absolute;right:0;top:26px;width:250px;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.55);z-index:9}
.pop .hd{font-size:10.5px;color:var(--faint);padding:3px 6px 5px}
.pop .cta{width:100%;justify-content:center;margin-top:4px;font-size:11.5px}

/* ================= 底部切换条（原型专用） ================= */
.vswitch{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:40;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none}
.vbar{display:flex;align-items:center;gap:4px;background:rgba(18,21,26,.96);border:1px solid var(--line-strong);border-radius:999px;padding:4px 6px;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:auto}
.vbtn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--dim);font-size:14px}
.vbtn:hover{background:var(--panel-3);color:var(--text)}
.vname{min-width:190px;text-align:center;font-size:12px;color:var(--text);padding:0 4px}
.vmeta{font-size:10.5px;color:var(--faint);background:rgba(18,21,26,.9);border:1px solid var(--line);border-radius:999px;padding:1px 10px;max-width:min(90vw,880px);text-align:center;pointer-events:auto}
.vstate{font-family:var(--mono);font-size:10px;color:var(--faint);background:rgba(10,14,19,.9);border:1px solid var(--line-soft);border-radius:8px;padding:2px 8px;max-width:min(90vw,880px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:auto}

#toast{position:fixed;right:18px;bottom:74px;z-index:50;background:var(--panel-3);border:1px solid var(--line-strong);border-radius:9px;padding:6px 11px;font-size:12px;color:var(--text);opacity:0;transform:translateY(6px);transition:opacity .16s,transform .16s;pointer-events:none;max-width:min(70vw,520px)}
#toast.on{opacity:1;transform:none}

/* 窄屏：左树收成抽屉 */
@media (max-width:1020px){
  .sheet{width:100%;height:100%}
  .sbody.cols2,.sbody.cols3{grid-template-columns:minmax(0,1fr)}
  .tree,.rail{display:none}
  .sheet.drawer .tree{display:flex;position:absolute;top:46px;bottom:0;left:0;width:290px;z-index:7;box-shadow:16px 0 40px rgba(0,0,0,.5)}
  .hgrid{grid-template-columns:minmax(0,1fr)}
  .ccol + .ccol{border-left:0;border-top:1px solid var(--line-soft);padding-left:0;padding-top:8px}
  .bside{display:none}
  .narrowonly{display:inline-flex !important}
  .main{grid-template-columns:minmax(0,1fr)}
  .sessions{display:none}
}
.narrowonly{display:none}
</style>
</head>
<body>

<div class="shell">
  <header class="topbar">
    <b>pi</b><span class="dim">本地桥 7864</span>
    <span class="spacer"></span>
    <span class="tagp">原型 · 不连桥，数据是假的</span>
  </header>
  <div class="main">
    <aside class="sessions">
      <div class="sh">会话</div>
      <div class="scard"><div>整理 order 接口</div><div class="p">E:/yqm/erp</div></div>

<script>
/* ============================================================
   模拟数据：E:/yqm/erp 是伞形目录，api / ui / legacy 各自是仓库
   ============================================================ */
const ROOT = "E:/yqm/erp";
const LIST = {
  "E:/yqm/erp": ["api", "ui", "docs", "scripts", "legacy", "node_modules", ".vscode"],
  "E:/yqm/erp/api": ["src", "tests", "migrations", "fixtures"],
  "E:/yqm/erp/api/src": ["routes", "db", "order"],
  "E:/yqm/erp/ui": ["src", "public", "e2e"],
  "E:/yqm/erp/ui/src": ["pages", "components"],
  "E:/yqm/erp/docs": ["specs", "images"],
  "E:/yqm/erp/docs/specs": ["orders", "repos"],
  "E:/yqm/erp/scripts": ["deploy", "seed"],
  "E:/yqm/erp/legacy": ["old-api"],
};
const REPOS = {
  "E:/yqm/erp/api": { branch: "main", dirty: 2, upstream: "origin/main", ahead: 1, behind: 0, last: "今天 10:42 · 补 order 字段表" },
  "E:/yqm/erp/ui": { branch: "feat/login", dirty: 0, upstream: "origin/feat/login", ahead: 3, behind: 1, last: "昨天 18:20 · 登录页骨架 + i18n" },
  "E:/yqm/erp/legacy": { branch: "master", dirty: 0, upstream: "origin/master", ahead: 0, behind: 0, last: "3 周前 · 归档" },
};
const C = (h, s, who, t, same) => ({ h, s, who, t, same });
const COMMITS = {
  "E:/yqm/erp/api": {
    cur: [C("a1f0c3d", "docs: 补 order 接口的字段表", "你", "今天 10:42"), C("7be21d9", "feat: 分页默认 20 → 50", "你", "昨天 18:03"), C("4c9a10b", "refactor: 抽 orderRepo", "你", "昨天 17:41"), C("0d3e77a", "fix: 价格按分存", "王", "2 天前", true), C("e8b152f", "test: 分页边界", "王", "2 天前", true), C("33aa90c", "chore: bump deps", "bot", "3 天前", true)],
    base: [C("0d3e77a", "fix: 价格按分存", "王", "2 天前", true), C("e8b152f", "test: 分页边界", "王", "2 天前", true), C("33aa90c", "chore: bump deps", "bot", "3 天前", true), C("9c11d04", "feat: 批量导出", "李", "3 天前"), C("bb70a21", "fix: 空结果的 500", "李", "4 天前")],
  },
  "E:/yqm/erp/ui": {
    cur: [C("5a7c112", "feat: 登录页骨架", "你", "昨天 18:20"), C("10b3ef8", "feat: i18n 文案表", "你", "昨天 15:02"), C("c91a004", "fix: 表单校验时机", "你", "2 天前"), C("33aa90c", "chore: bump deps", "bot", "3 天前", true)],
    base: [C("c81de99", "feat: 重置密码", "李", "昨天 09:11"), C("33aa90c", "chore: bump deps", "bot", "3 天前", true), C("7c0a512", "test: 组件快照", "李", "4 天前")],
  },
  "E:/yqm/erp/legacy": {
    cur: [C("11aa002", "chore: 归档说明", "王", "3 周前"), C("8f0c101", "fix: 老接口兼容", "王", "3 周前", true)],
    base: [C("8f0c101", "fix: 老接口兼容", "王", "3 周前", true)],
  },
};
const BRANCHES = {
  "E:/yqm/erp/api": { local: ["main", "feat/order-filter", "hotfix/price"], remote: ["origin/main", "origin/feat/order-filter", "origin/release/1.9"] },
  "E:/yqm/erp/ui": { local: ["feat/login", "main"], remote: ["origin/feat/login", "origin/main"] },
  "E:/yqm/erp/legacy": { local: ["master"], remote: ["origin/master"] },
};
const DIFF = {
  "E:/yqm/erp/api": [
    { st: "M", name: "src/order.ts", p: 18, m: 4 },
    { st: "M", name: "src/pages/list.tsx", p: 3, m: 1 },
    { st: "A", name: "tests/order.pagination.spec.ts", p: 42, m: 0 },
  ],
};

/* ============================================================
   状态 + 模拟探测
   ============================================================ */
const S = {
  variant: "A", dir: "E:/yqm/erp/api", tab: "history", closed: false, drawer: false,
  overlay: false, pop: false, q: "",
  expanded: new Set([ROOT, "E:/yqm/erp/api"]),
  probed: new Set([ROOT, "E:/yqm/erp/api"]),
  loading: new Set(),
};
const VARIANTS = {
  A: ["A · IDE 双栏", "左列常驻目录树 + 右侧工作台（三列：当前 / 对照 / 分支栏）", "最像编辑器：树一直在，切目录成本最低；左列永久占 252px。"],
  B: ["B · 仓库标签条 + 目录浮层", "顶部一条仓库标签，目录树收进浮层；工作台占满宽度", "切仓库最快（一排标签一眼看全），代价是「有哪些目录」要开一次浮层。"],
  C: ["C · 三栏仪表", "树 / 仓库摘要栏 / 工作台，三个并列；分支栏改成下拉", "所有子仓库的状态同屏，适合天天盯多仓库的人；横向最挤，工作台变窄。"],
};

const isHidden = (name) => name.startsWith(".") || name === "node_modules";
const children = (dir) => (LIST[dir] || []).filter((n) => !isHidden(n)).map((n) => dir + "/" + n);
const base = (p) => p.slice(p.lastIndexOf("/") + 1);
const rel = (p, from) => (p === from ? "" : p.startsWith(from + "/") ? p.slice(from.length + 1) : p);
const hasKids = (dir) => children(dir).length > 0;

function repoOf(dir) {
  if (!dir) return null;
  let p = dir;
  while (p && p.length >= ROOT.length) {
    if (REPOS[p]) return p;
    const i = p.lastIndexOf("/");
    if (i <= 0) break;
    p = p.slice(0, i);
    if (!p.startsWith(ROOT)) break;
  }
  return null;
}

function probe(dir) {
  if (S.probed.has(dir) || S.loading.has(dir)) return;
  S.loading.add(dir);
  render();
  setTimeout(() => {
    S.loading.delete(dir);
    S.probed.add(dir);
    children(dir).forEach((c) => { if (hasKids(c)) S.probed.add(c); });
    render();
  }, 240);
}

/* ============================================================
   共用片段
   ============================================================ */
function sheetHead() {
  const r = repoOf(S.dir);
  return `<header class="shead">
    <span class="t">目录与仓库</span>
    <span class="pfx" title="${ROOT}">${ROOT}</span>
    ${r ? `<span class="tg ok mono">⎇ ${REPOS[r].branch}</span>` : `<span class="tg">非 git 仓库</span>`}
    <span class="spacer"></span>
    <button class="btn ghost narrowonly" data-act="drawer">目录</button>
    <button class="btn ghost" data-act="copy">⧉ 复制路径</button>
    <button class="btn icon ghost" data-act="close" title="关闭（Esc）">✕</button>
  </header>`;
}

function treeRows() {
  if (S.q) {
    const q = S.q.toLowerCase();
    const all = Object.keys(LIST).flatMap((d) => children(d));
    const hits = [...new Set(all)].filter((d) => base(d).toLowerCase().includes(q)).slice(0, 40);
    if (!hits.length) return `<div class="tload">没有匹配的目录</div>`;
    return hits.map((d) => {
      const r = REPOS[d];
      return `<div class="flatrow" data-act="sel" data-dir="${d}">
        <span>${base(d)}</span><span class="pfx">${rel(d, ROOT).split("/").slice(0, -1).join("/")}</span>
        <span class="spacer"></span>${r ? `<span class="tbr mono" style="border:1px solid var(--accent-dim);border-radius:6px;padding:0 5px;font-size:10.5px;color:var(--accent)">⎇ ${r.branch}</span>` : ""}
      </div>`;
    }).join("");
  }
  const walk = (dir, depth) => {
    const name = base(dir);
    const r = REPOS[dir];
    const exp = S.expanded.has(dir);
    const sel = S.dir === dir;
    const kids = hasKids(dir);
    let html = `<div class="trow${sel ? " sel" : ""}${r ? " repo" : ""}" data-act="sel" data-dir="${dir}" style="padding-left:${8 + depth * 13}px">
      <button class="caret" data-act="toggle" data-dir="${dir}" title="${kids ? (exp ? "收起" : "展开（批量探测直接子目录）") : "空目录"}">${kids ? (exp ? "▾" : "▸") : "·"}</button>
      <span class="tname">${name}</span>
      <span class="spacer"></span>
      ${r ? `<span class="tbr">⎇ ${r.branch}</span>${r.dirty ? `<span class="tdirty" title="${r.dirty} 个未提交改动（不计未跟踪）">● ${r.dirty}</span>` : ""}` : `<span class="tnr">非仓库</span>`}
    </div>`;
    if (exp) {
      if (S.loading.has(dir)) html += `<div class="tload" style="padding-left:${8 + depth * 13 + 18}px">探测中…</div>`;
      else html += children(dir).map((c) => walk(c, depth + 1)).join("");
      if (!children(dir).length) html += `<div class="tload" style="padding-left:${8 + depth * 13 + 18}px">（没有子目录）</div>`;
    }
    return html;
  };
  return walk(ROOT, 0);
}

function treePane() {
  return `<div class="tree">
    <div class="tree-head">
      <button class="mini" data-act="up" title="上一级（可以越出 cwd 的子树）">↑ 上级</button>
      <span class="spacer"></span>
      <span class="faint small">目录</span>
    </div>
    <div class="tree-scroll">${treeRows()}</div>
    <div class="tree-foot">隐藏 . 开头 与 node_modules · 展开一层批量探测</div>
  </div>`;
}

function emptyPane() {
  const d = S.dir;
  const r = repoOf(d);
  if (r) return "";
  if (!d) {
    return `<div class="empty"><div class="big">在左边选一个目录</div>
      <div>展开只探测直接子目录，判过是仓库的会标 ⎇ 分支和 ● 改动数。</div></div>`;
  }
  if (d === ROOT) {
    const repos = children(ROOT).filter((x) => REPOS[x]);
    return `<div class="empty">
      <div class="big"><span class="mono">${ROOT}</span> 不是 git 仓库</div>
      <div>它下面有 ${repos.length} 个仓库：</div>
      <div class="repolist">${repos.map((x) => `<button class="btn" data-act="sel" data-dir="${x}">⎇ ${rel(x, ROOT)} · ${REPOS[x].branch}${REPOS[x].dirty ? " ●" + REPOS[x].dirty : ""}</button>`).join("")}</div>
      <div class="norepo">分支操作只能落在这些子仓库上；根目录自身没有分支可管。</div>
    </div>`;
  }
  return `<div class="empty">
    <div class="big"><span class="mono">${rel(d, ROOT) || d}</span> 不是 git 仓库</div>
    <div class="norepo">往上到 <span class="mono">${ROOT}</span> 也不是仓库，这里没有可管理的分支。</div>
    <div class="faint">在左边点一个带 ⎇ 的目录，右栏就切到那个仓库的工作台。</div>
  </div>`;
}

function commitCol(list, cap) {
  return `<div class="ccap"><b>${cap}</b><span class="spacer"></span><span>${list.length} 个提交</span></div>` +
    list.map((c) => `<div class="commit${c.same ? " same" : ""}">
      <span class="h mono">${c.h}</span>
      <div class="s"><div class="line">${c.s}${c.same ? `<span class="sametag">同</span>` : ""}</div>
      <div class="meta">${c.who} · ${c.t}</div></div>
    </div>`).join("");
}

function branchSide(repo) {
  const b = BRANCHES[repo] || { local: [], remote: [] };
  const cur = REPOS[repo].branch;
  return `<aside class="bside">
    <h4>分支 · 本地 + 远程</h4>
    ${b.local.map((x) => `<div class="brow${x === cur ? " cur" : ""}" data-act="noop" title="选中后可用动词操作">${x === cur ? "● " : "○ "}${x}</div>`).join("")}
    <div style="height:6px"></div>
    ${b.remote.map((x) => `<div class="brow" data-act="noop" title="远程分支">⌥ ${x}</div>`).join("")}
    <button class="btn cta" data-act="noop">打包成一次咨询 → 交给 agent</button>
    <button class="btn cta pri" data-act="noop">✎ 选分支 + 写要求 → 交给 AI</button>
  </aside>`;
}

function tabBody(repo, withAside) {
  const info = REPOS[repo];
  if (S.tab === "history") {
    const cm = COMMITS[repo] || { cur: [], base: [] };
    return `<div class="hgrid${withAside ? "" : " noaside"}">
      <div class="ccol">${commitCol(cm.cur, "当前 · " + info.branch)}</div>
      <div class="ccol">${commitCol(cm.base, "对照 · " + info.upstream)}</div>
      ${withAside ? branchSide(repo) : ""}
    </div>`;
  }
  if (S.tab === "diff") {
    const files = DIFF[repo] || DIFF["E:/yqm/erp/api"];
    return `<div class="files">${files.map((f) => `<div class="file"><span class="st ${f.st === "A" ? "new" : ""}">${f.st}</span><span class="n">${f.name}</span><span class="c"><span class="p">+${f.p}</span> <span class="m">−${f.m}</span></span></div>`).join("")}</div>
      <div class="hunk"><div class="hh">diff --git a/src/order.ts b/src/order.ts · +18 −4</div>
        <div class="l ctx">@@ -41,7 +41,9 @@ async function listOrders(q) {</div>
        <div class="l m">-  const pageSize = 20;</div>
        <div class="l p">+  const pageSize = clamp(q.size ?? 50, 1, 200);</div>
        <div class="l p">+  const cursor = q.cursor ? decode(q.cursor) : null;</div>
        <div class="l ctx">   const rows = await db.query(</div>
        <div class="l m">-    sql\`select * from orders limit \${pageSize}\`,</div>
        <div class="l p">+    sql\`select * from orders where id > \${cursor ?? 0} limit \${pageSize}\`,</div>
        <div class="l ctx">   );</div>
      </div>`;
  }
  return `<div class="manblock"><b>切分支</b>写操作都在右栏顶端：<code>切换分支</code> 会先跑 dirty 检查，有改动会先问，不会直接硬切。</div>
  <div class="manblock"><b>这个仓库的行规矩</b>合并一律 <code>--no-ff</code>；<code>main</code> 保护，走 PR；提交信息用 <code>feat:/fix:/docs:</code> 前缀。</div>
  <div class="manblock"><b>多仓库一起改</b>同一件事跨 api / ui 时，两个仓各开一个分支、同名；收尾时一起合，别只合一半。</div>
  <div class="manblock"><b>本窗和「分支 · 本地+远程」栏的关系</b>分支栏是仓库级的视图，选目录只是决定右栏显示哪个仓库；两件事互不覆盖。</div>`;
}

function verbs() {
  const items = ["拉取最新", "切换分支", "新建分支"];
  return `<div class="verbs">
    ${items.map((x) => `<button class="btn" data-act="noop">${x}</button>`).join("")}
    <button class="btn ghost" data-act="noop">全部动词…</button>
    <span class="spacer"></span>
    <button class="btn ghost" data-act="noop" title="复制分支名">⎇ 复制分支名</button>
    <button class="btn pri" data-act="noop">交给 AI 操作…</button>
  </div>`;
}

function branchPop(repo) {
  const info = REPOS[repo];
  const b = BRANCHES[repo] || { local: [], remote: [] };
  return `<span class="popwrap"><button class="btn" data-act="pop">⎇ ${info.branch} ▾</button>
    ${S.pop ? `<div class="pop">
      <div class="hd">分支 · 本地 + 远程</div>
      ${b.local.map((x) => `<div class="brow${x === info.branch ? " cur" : ""}" data-act="noop">${x === info.branch ? "● " : "○ "}${x}</div>`).join("")}
      ${b.remote.map((x) => `<div class="brow" data-act="noop">⌥ ${x}</div>`).join("")}
      <button class="btn cta" data-act="noop">打包成一次咨询 → 交给 agent</button>
      <button class="btn cta pri" data-act="noop">✎ 选分支 + 写要求 → 交给 AI</button>
    </div>` : ""}</span>`;
}

function panel(opts) {
  const repo = repoOf(S.dir);
  if (!repo) return `<div class="panel">${emptyPane()}</div>`;
  const info = REPOS[repo];
  const sub = rel(S.dir, repo);
  return `<div class="panel">
    <div class="pline">
      <span class="rname mono" title="${repo}">${rel(repo, ROOT) || repo}</span>
      <span class="bchip mono">⎇ ${info.branch}</span>
      ${info.dirty ? `<span class="dirty" title="未提交改动（工作台语义，含未跟踪）">● ${info.dirty} 个改动</span>` : `<span class="clean">● 干净</span>`}
      <span class="faint mono small">${info.upstream}${info.ahead ? ` ↑${info.ahead}` : ""}${info.behind ? ` ↓${info.behind}` : ""}</span>
      ${sub ? `<span class="selnote">选中：<b class="mono">${sub}</b></span>` : ""}
      <span class="spacer"></span>
      ${opts.popover ? branchPop(repo) : ""}
    </div>
    ${verbs()}
    <div class="cmp"><span>对照</span><button class="chip" data-act="noop">${info.upstream}</button><span>↔</span><b class="mono" style="color:var(--dim)">${info.branch}</b><span>·</span><span>${(COMMITS[repo] || { cur: [] }).cur.length} 个提交</span></div>
    <div class="tabs">
      ${[["history", "历史"], ["diff", "差异"], ["manual", "图解手册"]].map(([k, label]) => `<button class="tab${S.tab === k ? " on" : ""}" data-act="tab" data-tab="${k}">${label}</button>`).join("")}
    </div>
    <div class="pbody">${tabBody(repo, opts.aside)}</div>
    <div class="pfoot"><span class="mono">⎇ ${info.branch}</span><span>·</span><span>${info.last}</span><span class="spacer"></span><span>Esc 关闭</span></div>
  </div>`;
}

/* ============================================================
   三个变体
   ============================================================ */
function variantA() {
  return `<div class="sheet${S.drawer ? " drawer" : ""}" data-v="A">
    ${sheetHead()}
    <div class="sbody cols2">${treePane()}${panel({ aside: true })}</div>
  </div>`;
}
function variantB() {
  const repos = Object.keys(REPOS);
  const cur = repoOf(S.dir);
  return `<div class="sheet${S.drawer ? " drawer" : ""}" data-v="B">
    ${sheetHead()}
    <div class="sbody rows2">
      <div class="rtabs">
        ${repos.map((r) => {
          const i = REPOS[r];
          return `<button class="rtab${cur === r ? " on" : ""}" data-act="sel" data-dir="${r}" title="${r}">
            ${rel(r, ROOT)} <span class="b mono">⎇ ${i.branch}</span>${i.dirty ? `<span class="d"></span>` : ""}</button>`;
        }).join("")}
        <button class="rtab add" data-act="overlay">＋ 目录…</button>
      </div>
      ${panel({ aside: true })}
      ${S.overlay ? `<div class="dirover" data-act="overlay-close">
        <div class="dirover-card">
          <div class="dirover-head">
            <input id="q" placeholder="搜索目录名…" autocomplete="off" />
            <button class="btn icon ghost" data-act="overlay-close">✕</button>
          </div>
          <div class="dirover-tree">${treeRows()}</div>
          <div class="dirover-foot">根 = ${ROOT} · 隐藏 . 开头与 node_modules · 选中后收起</div>
        </div>
      </div>` : ""}
    </div>
  </div>`;
}
function variantC() {
  const repos = Object.keys(REPOS);
  const cur = repoOf(S.dir);
  return `<div class="sheet${S.drawer ? " drawer" : ""}" data-v="C">
    ${sheetHead()}
    <div class="sbody cols3">
      ${treePane()}
      <div class="rail">
        <div class="rail-head">仓库 <span class="faint">${repos.length}</span> <span class="spacer"></span></div>
        <div class="rail-scroll">
          ${repos.map((r) => {
            const i = REPOS[r];
            return `<div class="rcard${cur === r ? " on" : ""}" data-act="sel" data-dir="${r}" title="${r}">
              <div class="top"><b>${rel(r, ROOT)}</b>${i.dirty ? `<span class="d" title="${i.dirty} 个改动"></span>` : ""}</div>
              <div class="b">⎇ ${i.branch}${i.ahead ? ` ↑${i.ahead}` : ""}${i.behind ? ` ↓${i.behind}` : ""}</div>
              <div class="m">${i.last}</div>
            </div>`;
          }).join("")}
        </div>
        <div class="rail-foot">只列判过是仓库的目录 · 由批量探测填充</div>
      </div>
      ${panel({ aside: false, popover: true })}
    </div>
  </div>`;
}

/* ============================================================
   渲染 / 事件
   ============================================================ */
const stage = document.getElementById("stage");
const toastEl = document.getElementById("toast");
let toastT = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => toastEl.classList.remove("on"), 1900);
}

function render() {
  const v = S.variant;
  // 原型说明：这些模板全是本文件的字面量，没有任何外部输入；S.q 走属性赋值，不拼进 HTML。
  // pi-lens-ignore: no-inner-html-js
  stage.innerHTML = S.closed ? "" : `<div class="back" data-act="backdrop">${({ A: variantA, B: variantB, C: variantC })[v]()}</div>`;
  document.getElementById("vname").textContent = VARIANTS[v][0];
  document.getElementById("vmeta").textContent = VARIANTS[v][2];
  document.getElementById("vstate").textContent =
    `variant=${v} sel=${S.dir || "—"} repo=${repoOf(S.dir) || "—"} tab=${S.tab} exp=[${[...S.expanded].map((d) => rel(d, ROOT) || "root").join(",")}] closed=${S.closed}`;
  if (S.overlay && S.variant === "B") {
    const q = document.getElementById("q");
    if (q) {
      q.value = S.q;
      q.oninput = (e) => { S.q = e.target.value; render(); const n = document.getElementById("q"); if (n) { n.focus(); n.setSelectionRange(S.q.length, S.q.length); } };
    }
  }
}

function selectDir(dir) {
  S.dir = dir;
  S.overlay = false;
  S.q = "";
  S.pop = false;
  if (hasKids(dir) && !S.expanded.has(dir)) { S.expanded.add(dir); }
  probe(dir);
  render();
}

stage.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  if (act === "toggle") {
    e.stopPropagation();
    const d = t.dataset.dir;
    if (!hasKids(d)) return;
    if (S.expanded.has(d)) S.expanded.delete(d);
    else { S.expanded.add(d); probe(d); }
    render();
    return;
  }
  if (act === "sel") { selectDir(t.dataset.dir); return; }
  if (act === "up") {
    const p = S.dir.slice(0, Math.max(0, S.dir.lastIndexOf("/")));
    if (!p || p.length < 3) { toast("已经到盘符根了（原型）"); return; }
    selectDir(p);
    return;
  }
  if (act === "copy") {
    try { navigator.clipboard.writeText(ROOT); } catch { /* file:// */ }
    toast(`已复制 ${ROOT}（真实实现走 navigator.clipboard）`);
    return;
  }
  if (act === "close") { S.closed = true; render(); return; }
  if (act === "closeX") { S.closed = true; render(); return; }
  if (act === "backdrop") { if (e.target === t) { S.closed = true; render(); } return; }
  if (act === "tab") { S.tab = t.dataset.tab; S.pop = false; render(); return; }
  if (act === "pop") { S.pop = !S.pop; render(); return; }
  if (act === "drawer") { S.drawer = !S.drawer; render(); return; }
  if (act === "overlay") { S.overlay = true; S.q = ""; render(); return; }
  if (act === "overlay-close") { S.overlay = false; S.q = ""; render(); return; }
  if (act === "noop") {
    toast("原型：这里接老工作台的动词 / 操作卡，不重复画一遍");
    return;
  }
});

document.getElementById("cwdchip").addEventListener("click", () => {
  S.closed = false;
  render();
});

const vKeys = Object.keys(VARIANTS);
function setVariant(v) {
  S.variant = v;
  S.tab = "history";
  S.pop = false;
  try { const u = new URL(location.href); u.searchParams.set("variant", v); history.replaceState(null, "", u); } catch { /* file:// */ }
  render();
}
document.querySelector(".vswitch").addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  if (t.dataset.act === "prev") setVariant(vKeys[(vKeys.indexOf(S.variant) + vKeys.length - 1) % vKeys.length]);
  if (t.dataset.act === "next") setVariant(vKeys[(vKeys.indexOf(S.variant) + 1) % vKeys.length]);
});

document.addEventListener("keydown", (e) => {
  const typing = /^(input|textarea)$/i.test(document.activeElement?.tagName || "");
  if (e.key === "Escape") {
    if (typing) return;
    if (S.pop) { S.pop = false; render(); return; }
    if (S.overlay) { S.overlay = false; render(); return; }
    if (S.drawer) { S.drawer = false; render(); return; }
    if (!S.closed) { S.closed = true; render(); }
    return;
  }
  if (typing) return;
  if (e.key === "ArrowLeft") { setVariant(vKeys[(vKeys.indexOf(S.variant) + vKeys.length - 1) % vKeys.length]); }
  if (e.key === "ArrowRight") { setVariant(vKeys[(vKeys.indexOf(S.variant) + 1) % vKeys.length]); }
});

const want = new URLSearchParams(location.search).get("variant");
if (want && VARIANTS[want]) S.variant = want;
render();
</script>
</body>
</html>
